ოიხედეს\nდა იქვე ვენახის ღობესთან დაინახეს ვეებერთელა ქლიავის ხეზე\nთორმეტიოდე წლის ინგილო გოგონა, რომელსაც ქლიავი ესროლნა\nმეფისათვის.\nმეფის მხლებელნი წამსვე ჩამოიჭრნენ ცხენებიდან, აცვივდნენ ღობეზე\nდა შეჰყვირეს პატარა ქალს:\n— შე ბრიყვო, შე საძაგელო, ეს რა ჰქენი? მეფე ერეკლეს თავზე ქლიავის\nგადმოყრა როგორ გაუბედე? ჩამო ახლავე ხიდან და ბოდიში მოითხოვე\nმეფის წინაშე, თორემ შავი დღე დაგადგება!\n— რაო? მეფე ერეკლეო? — განცვიფრებით ჩამოსძახა ზევიდან გოგონამ.\n— რას ამბობ? ეგ რომ ჩვენი სახელოვანი მეფე იყოს, განა სპარსულს ქუდს\nთავზე დაიხურავდა? არა, ეგ ტყუილია. მე ქლიავი თავზე გადმოვაყარე\nსპარსელს, ჩვენს მოსისხლე მტერს, და არა მეფე ერეკლეს, რომელიც\nქართველებს ღმერთივით გვიყვარს, თქვენ სულ ტყუილად მემუქრებით.\nარც ძირს ჩამოვალ და არც ბოდიშს მოვიხდი! — და უფრო მაღლა წავიდა\nხეზე.\nეს პასუხი გაიგონა მეფე ერეკლემ, გულიანად გადიხარხარა, მოიხადა\n\nსპარსული ქუდი, რომლის ტარებას დაეჩვია ყმაწვილობაში, სპარსეთში\nყოფნის დროს, დაანახვა თავისი მშვენივრად მოყვანილი ქართული თავი\nდა შესძახა პატარა ქალს: “ყოჩაღ, ქალო! სრულიად მართალი ხარ.\nსპარსული ქუდი სწორედ რომ არ უნდა მეხუროს მე. ქართველი მეფე\nგარეგნობითაც, ტანისამოსითაც ქართველი უნდა იყოს. კარგი, ჩინებული\nდარიგება მომეცი შენ მაგ ქლიავის სროლით — ბარაქალა შენს ქალობას!”\nამასთან ერეკლემ იკრა ჯიბეს ხელი, ამოიღო მთელი ბღუჯა თეთრი\nფული, მისცა თავის მხლებელს და უბრძანა: საჩუქრად მიეცი ეს მაგ\nსამაგალითო ქართველ გოგუცუნასაო.\nგოგო ახლა კი მიხვდა თავის შეცდომას და ძლიერ შეწუხდა. საჩუქარი\nშორს დაიჭირა, ცივ უარზე დადგა, მაგრამ მხლებელმა უთხრა\nმოსარბილებლად: “განა მეორედაც გინდა აწყენინო მეფეს? მეფის\nწყალობაზე უარის თქმა ვის გაუგონია? თუ გსურს შენი შეცდომა\nგაასწორო და ერეკლე მეფეს აამო, ეს ფული მიიღე საჩუქრად”.\nმაშინ კი დაეთანხმა გოგო, ზევიდან ქვემო ტოტზე ჩამოსწვდა ძირს,\nგამოართვა ფული და ჯიბეში ჩაიჩხრიალა; მერე შურდულივით ავარდა\nქლიავის კენწეროზე. კარგად გამოჩნდა, გასწორდა ტოტზე, მეფეს დაბლა\nდაუკრა თავი და წკრიალა ხმით გადმოსძახა:\n“მეფე ერეკლეს გაუმარჯოს!”\n— “ქართველ ქალსაც გაუმარჯოს!” — შესძახა მამობრივი ხმით მეფე\nერეკლემ, დასძრა თავისი ბედაური და ჯერ კიდევ თავმოხდილი\nგაუძღვა ჯარს. ჯარი, ამაყი თავისი მამაცი მეფით და თავისი ვაჟკაცობით,\nუკან მისდევდა მწყობრად და თანაც აგუგუნებდა მშვენიერ ქართულს\nსიმღერას. პატარა ქალი კი იდგა ამართული ქლიავის კენწეროზე, თვალს\nარ აშორებდა მიმავალ მეფესა და მის ჯარს, და შეწყდებოდა თუ არა\nსიმღერა, ჰაერში გაისმოდა მისი ზარივით ხმა: “მეფე ერეკლეს\nგაუმარჯოს!” “ქართველ ჯარს გაუმარჯოს!” — ამ სახით იდგა პატარა\nქალი დიდხანს და იმისთანა სიხარულს, იმისთანა ნეტარებას გრძნობდა,\nროგორიც წინათ სიზმრადაც არ მოსჩვენებია. ქალს უზომოდ ახარებდა\n\nსანატრელი მეფის ნახვა, მასთან საუბარი, მისი მამობრივი ქება, მისი\nსაჩუქარი. ქალი, სიხარულით დამთვრალი, მხოლოდ მაშინ ჩამოვიდა\nქლიავის ხიდან, როდესაც შორეულმა ნისლმა დაფარა მეფეც და მისი\nჯარიც.\nმაგრამ ქალს წასვლა აღარ უნდოდა. ის სიყვარულით შესცქეროდა ხან იმ\nადგილს, სადაც მეფე ერეკლე იდგა და ელაპარაკებოდა, ხან ქლიავის ხეს,\nრომელთანაც იმ დღიდან შეერთდა, შეხორცდა მის გონებაში ბედნიერი\nწამი, უტკბილესი შემთხვევა. ერთი საათის წინათ უბრალო ხეხილი ახლა\nამ პატარა ქალის თვალში გადაიქცა გულითად მეგობრად, ძვირფას\nმოკეთედ, თითქმის კეთილ სულიერად, გადაიქცა სამუდამოდ,\nსაუკუნოდ.\nბოლოს გოგუცუნა გამოფხიზლდა ჭარბი სიხარულიდან, მოაგონდა\nთავისი დედ-მამა და მოკურცხლა შინისაკენ, რათა ეხარებინა მათთვის\nთავისი საარაკო ბედნიერება.\n2 გავიდა რამდენიმე წელიწადი. ერთს ინგილო გლეხს თავის დარბაზში\nქორწილი ჰქონდა გაჩაღებული. დედოფლად იყო ჩვენი ნაცნობი ინგილო\nქალი, ახლად შეღერებული და ისეთი ეშხიანი, რომ კაცი თვალს ვერ\nმოაშორებდა. მას გვერდს უმშვენებდა ერთი საუკეთესო ინგილო ვაჟკაცი.\n“ფერი ფერსა, მადლი ღმერთსა”, —ფიქრობდა და ამბობდა ყველა, ვინც კი\nამ ნეფე- დედოფალს ერთად ხედავდა.\nდაიწყო თუ არა საქორწილო ლხინი, თამადამ ბრძანების კილოთი\nწარმოთქვა ხმამაღლა: — “სმენა იყოს და გაგონება! ეს ღმერთმა\nაცოცხლოს და ადღეგრძელოს, ჩვენი გმირი მეფე ერეკლე, გამარჯობა ნუ\nმოაკლოს ლეკებზე, სპარსელებზე, ოსმალებზე, სამხრეთსა და\nაღმოსავლეთზე!” — “ადღეგრძელოს, ადღეგრძელოს!” — ისეთი\nაღტაცებით შესძახეს სტუმრებმა, რომ კაცს შეეშინდებოდა, ჭერი არ\nჩამოინგრესო.\nსწორედ ამ წუთს, უცებ გაიღო დარბაზის კარი, შევიდა ერთი უცხო\nვაჟკაცი, მშვენიერ ტანისამოსში გამოწყობილი, და სალამი მისცა:\n\n“აგაშენოთ ღმერთმა და აბედნიეროს ნეფე-დედოფალი”. მერე თქვა: “რა\nჩინებულს დროს მოვედი! მე გამომგზავნა მეფე ერეკლემ და მიბრძანა: ეს\nსაჩუქარი მიართვი ინგილო ქალს, რომელმაც რამდენიმე წლის წინათ\nმთელი მუჭა ქლიავი უთავაზა ჩემს სპარსულ ქუდსაო”, — და გადასცა\nდედოფალს ვეებერთელა ქისა, სავსე ბაჯაღლო ოქროებით, — მზითევიც\nგამომატანა და აი კიდეც მოაქვთ, — და ამ დროს კარზე მოადგათ\nრამდენიმე ურემი, დატვირთული მშვენიერი მზითვის ნივთეულობითა.\nდატრიალდა ისეთი სიხარული, ატყდა ისეთი ქება და დიდება\nერეკლესი, მისი კაცთმოყვარეობისა, რომ არც ენით ითქმის და არც\nკალმით აიწერება სავსებით. არ დარჩა არც ერთი ლექსი იმ მრავალ\nსადიდებელ ლექსთაგან, რომლებიც ერეკლეზე იყო გამოთქმული, რომ\nარ ემღერათ სტუმრებს უსაზღვრო აღტაცებით. მღეროდნენ კაცნიც,\nქალნიც, დიდნიც და პატარანიც და ადიდებდნენ მეფე ერეკლეს.\nმეტადრე დედოფალი სწორედ სამოთხის ნეტარებას გრძნობდა. ისე\nმზითევი არ ახარებდა, როგორც ყურადღება სათაყვანო მეფისა.\nეს ხმა ფიცხლავ გავარდა მთელს საინგილოში და ყველა ინგილო, ქალი\nთუ კაცი, მზითვის გაგზავნას მეფისაგან საკუთარ პირად ჯილდოდ\nთვლიდა, მთელი საინგილოს დასაჩუქრებად მიაჩნდა. ეს განაპირა\nკუთხე საქართველოსი მთლად აივსო მხურვალე მადლობით და უზომო\nერთგულებით მეფისადმი.\n3 ამის შემდეგ განვლო კიდევ ოცდახუთმა წელმა.\nკრწანისის ველზე, თბილისის მახლობლად, საშინელი ომი იყო, ხუთი\nათასი ქართველი ებრძოდა სამშობლოს დასაცველად სამოცდა ათი ათას\nსპარსელს; თითქმის ოთხმოც წელს მიღწეული მეფე ერეკლე, ჯერ კიდევ\nმხნე და გულადი, ლომივით იბრძოდა და თავს სრულიად არ ზოგავდა.\nმისი სიცოცხლე ყოველ წამს საფრთხეში იყო. ხან მის ახლო, ხან მის\nგვერდით, ხან მის წინ იბრძოდნენ, სხვათა შორის, ორნი ნორჩნი\nვაჟკაცნი, რომელნიც თავისი საოცარი სიმამაცით, თავისი\nთავგანწირულობით ყველას ყურადღებას იპყრობდნენ, ყველას\n\nაკვირვებდნენ. არა ერთხელ აქციეს მათ უკან მტერი, მეფეზე მოსული,\nარა ერთხელ მიუშვირეს მათ საკუთარი მკერდი მტრის ტყვიასა და\nხმალს, მეფისათვის დამიზნებულს, არა ერთ სპარსელს დაუბნელეს მზე,\nმაგრამ თავიანთი სიცოცხლე კი შესწირეს მეფესა და საქართველოს:\nორივენი დაიხოცნენ კრწანისის ველზე გმირული სიკვდილით მეფე\nერეკლეს თვალწინ.\nვინ იყვნენ ეს ნორჩნი ვაჟკაცნი?\nესენი იყვნენ უფროსი ვაჟიშვილები ჩვენი ნაცნობი ინგილო ქალისა და\nნათლულნი თვით მეფე ერეკლესი.\nდედას მალე მოუვიდა საინგილოში ამბავი: შენმა შვილებმა დიდი\nვაჟკაცობა გამოიჩინეს, არა ერთხელ გადაარჩინეს სიკვდილს თავისი\nნათლია მეფე, მრავალს სპარსელს დაუბნელეს მზე და თავი შესწირეს\nმეფესა და საქართველოსაო:\n“ვმადლობ, მხურვალედ ვმადლობ უფალს, რომ მან აღირსა ჩემს შვილებს\nგმირული სიკვდილი, სიკვდილი სახელოვანი მამულიშვილებისა!” —\nწარმოთქვა დედამ იმისთანა ხმით, რომელშიაც დიდ ნუგეშთან ერთად\nცხადად ისმოდა უღრმესი და უმწარესი დედობრივი მწუხარება.\n“ტყუილად კი არ მძულდნენ პატარაობიდანვე სპარსელები ისე ძლიერ,\nრომ მზად ვიყავი ყოველს მათს დანახვაზე ზედ შევკვდომოდი. გული\nთითქოს მაშინვე მეუბნებოდა, ეს მტარვალები შენც და შენს საყვარელს\nსაქართველოსაც დიდს უბედურებას მიაყენებენო: და, აჰა, წინათგრძნობა\nგულისა მთლად ამიცხადდა. მაგრამ ნუ გაუხარდებათ მტრებს, —\nგანაგრძო სამაგალითო დედამ, — ღვთის წყალობით, მე კიდევ მყავს\nოთხი ვაჟი და ორი ქალი. მე მათ დავზრდი უფრო უკეთეს, უფრო\nგულმხურვალე მამულიშვილებად, და ისინი სხვა დედების აღზრდილ\nმამულიშვილებთან ერთად გადაუხდიან მტერს სამაგიეროს და ჩვენს\nსაქართველოს დააყენებენ ბედნიერს გზაზე”.ეს ამბავი ქლიავის სროლისა\nჩვენი მოგონილი არ არის , ხალხის თქმულებას შეადგენს (ავტორის\nშენიშვნა).", "pages": "45–49"}, {"title": "ერთი მერცხლის ჭიკჭიკი", "text": "ზამთარი იწურებოდა. ახმაურდნენ ნაკადულები. ენძელებმაც ამოყვეს თავი თოვლიდან.\n\nერთი მერცხალი დაწინაურდა, თბილი ქვეყნებიდან ადრე დაბრუნდა და ჭიკჭიკი მორთო.\n\nმეცხვარეს ეგონა, ეს არის გაზაფხული დადგაო და ცხვრები დაკრიჭა.\n\nმეორე დღეს კვლავ აცივდა. თოვლი მოვიდა და ყინვამ გაკრეჭილი ფარა კინაღამ გაწყვიტა.\n\nმაშინ მეცხვარემ თქვა:\n\n- ახლა კი ვხედავ, რომ ერთი მერცხლის ჭიკჭიკი გაზაფხულს ვერ მოიყვანსო.", "source": "docx"}, {"title": "კატო და კატა", "text": "ბანზე პურის მარცვლები ეყარა. ახლოს კატა იწვა, თვალები დახუჭული ჰქონდა, კუდი გადაგდებული.\n\nჩიტის ბარტყს ეგონა კატას სძინავსო და ახლოს დაუჯდა მარცვლების ასაკრეფად.\n\nბედად იმავე ბანზე კეთილი კატო წინდებს ქსოვდა, მან კარგად იცოდა კატის ეშმაკობის ამბავი. შეეცოდა გამოუცდელი ბარტყი, აუქშია, დააფრთხო და გადაარჩინა კატის კლანჭებს.", "source": "docx"}, {"title": "მგელი და წერო", "text": "მგელს ყელზე ძვალი დაადგა და იხრჩობოდა. დაუძახა წეროს და უთხრა:\n\n- შენ, ჩემო ნათლიავ, გრძელი ნისკარტი გაქვს, ჩამიყავი ყელში, ამოიღე ძვალი და დაგასაჩუქრებო.\n\nწერომ ჩაუყოო ნისკარტი, ძვალი ამოაცალა და უთხრა:\n\n- აბა, დამასაჩუქრეო!\n\nმგელმა კბილები გააკრაჭუნა:\n\n- განა ის კი არ გეყო საჩუქრად, რომ თავი არ მოგგლიჯე, როცა ჩემს კბილებშუა იყოო?", "source": "docx"}, {"title": "მელია და ქოთანი", "text": "გლეხი ყანას მკიდა. ცოლმა სადილად ერთი ქოთანი მაწონი მიუტანა და ძნასთან დადგა. საიდანღაც მელია გაჩნდა, ქოთანს მიეპარა, შიგნით თავი ჩაჰყო და სასწრაფოდ სულ ამოსვლიპა. მაწონი რომ გაათავა, თავი შიგ გაეჭედა და ვეღარ ამოიღო. მელია დადიოდა, თავს იქნევდა და ქოთანს ეუბნებოდა:\n\n- კარგია, ქოთანო, გეყოფა მაგდენი ხუმრობა, ახლა გამიშვიო. მაგრამ ქოთანი მელიას არ ეშვებოდა.\n\nმელია გაჯავრდა:\n\n- მოიცა, შე დაწყევლილო ქოთანო, რა გიქნა! არ გინდა თავად მომშორდე და მიყურე, როგორ დაგახრჩოო!\n\nმელია მდინარისკენ გაიქცა, ქოთანი შიგ ჩააყურყუმელავა - თავის ჭკუაში უნდა დაეხრჩო...\n\nქოთანი წყალმა მართლაც ჩაძირა, მაგრამ ქოთანმა მელაც თან ჩაიტანა.", "source": "docx"}, {"title": "ჭრიჭინა და ჭიანჭველა", "text": "შემოდგომის კარგი დარი იყო. ჭიანჭველებს ზევით ამოეყარათ დასველებული პური და მხეზე აშრობდნენ.\n\nმშიერი ჭრიჭინა მივიდა და სთხოვა: ცოტაოდენი საჭმელი მიწილადეთო.\n\nჭიანჭველებმა ჰკითხეს: ზაფხულში რას აკეთებდი, რატომ საზამთროთ საზრდო არ მოაგროვეო?\n\n- გენაცვალეთ, ნაგისთვის სად მეცალა, სულ სიმღერას გავძახოდიო, - უთხრა ჭრიჭინამ.\n\n- თუ შენახვის დროს მღეროდი, ახლა რომ გშია, იხტუნეო, - უთხრეს ჭიანჭველებმა.", "source": "docx"}, {"title": "ბეღურა", "text": "ბეღურა პატარა ფრინველია, ორის გოჯის სიგრძე, ნაცრისფერი და ძალიან ცქვიტი. ბეღურას ყოველს დღეს ვხედავთ, ამიტომ რომ, იქ უყვარს ცხოვრება, სადაც ადამიანი ცხოვრობს; ტყეში და შორს მინდორში ყოფნა არ მოსწონს.\n\nრატომ იზიდავს ბეღურა ადამიანი? იქნებ სიყვარულის გამო? სრულიადაც არა. ბეღურამ კარგად იცის, რომ ადამიანი მისი მტერია, ამიტომ არასდროს არ ენდობა მას. ბეღურა ადამიანის ახლოს იმისთვის ცხოვრობს, რომ უყვარს პურის მარცვლების, ფეტვის, ბალისა და სხვა ხილის ჭამა. მართალია ამით ადამიანს ზარალს აყენებს, მაგრამ ბევრს სიკეთესაც აკეთებს: ხოცავს და ჭამს დიდი რაოდენობით ბუზებს, მატლებს, ჭიებს და კალიებს, რომლებიც მავნებელნი არიან ადამიანისთვის. ამიტომ, რომელ ქვეყანაშიაც ბეღურა არ არის, ყოველთვის ცდილობენ  მის მოშენებას და გამრავლებას..\n\nეს ერთი ბეწო ფრინველი ძალიან ჭკვიანია. ბეღურა ყველა თავისოდენა ფრინველს ბევრად აღემატება ჭკუით. არც ერთს პატარა ფრინველს არა აქვს იმდენი ეშმაკობა, რამდენიც ბეღურას. ყოველთვის ხომ ადამიანის ახლოს ცხოვრობს, მაგრამ მისი დაჭერა ან მოკვლა იოლი საქმე არ არის.\n\nდაინახავს თუ არა ახლოს ადამიანს, ბეღურა მაშინვე აათვალიერ-ჩაათვალიერებს, და თუ ხელში რამე სასროლი საგანი დაუნახა, მაშინვე გაფრინდება, - თუ არადა, სრულიად არაფერს შეეპუება.\n\nბეღურა ბუდეს იკეთებს ბანების ქვეშ, საბძლებში, კოშკის კედლებში, ხეების ფუტუროებში და სხვა. თუ ბეღურებმა ბუდისთვის მოხერხებული ადგილი ნახეს, დიდს ჩხუბს გამართავენ: ყველა დედალ-მამალი ცდილობს, რომ ეს ადგილი დაისაკუთროს. ამ დროს ერთმანეთს ნისკარტებით ბუმბულს აგლეჯენ, თავში სცემენ და ჰქოჩრავენ. რომელი დედალ-მამალიც გაიმარჯვებს, ბუდის ადგილი მას რჩება.\n\nბუდეს ბეღურა ბუმბულით და ჩალით მოფენს ხოლმე. ხან მერცხლებს ართმევს ბუდეს და შვილებს იქ ზრდის. ბეღურა ბარტყებს წელიწადში სამჯერ ჩეკს; თუ ცუდი დარია, ორჯერ. ბუდეში დედალ-მამალი ზის ცამეტ-თოთხმეტს დღეს და დიდ წვალებას გამოივლის ხოლმე შვილების გამოზრდაში. კიდევ კარგია, თუ გაზარდა და დააფრინა; მაგრამ ზოგჯერ გაზრდის შვილებს, დასაფრენად მომზადებულს, ბუდიდან პატარა ბიჭები გადმოუსხამენ ხოლმე. დიდ ჯავრსა და წვალებას ითმენს საწყალი უშვილოდ დარჩენილი ბეღურა.\n\nდაფრენის შემდეგ რვა დღეში ბეღურები შვილებს ფრენასა და საჭმლის შოვნას ასწავლიან; მერე ბარტყებს თავს ანებებენ და მეორედ გამოჩეკას იწყებენ.", "source": "docx"}, {"title": "ლომი და თაგვი", "text": "ერთ ხშირ, დაბურულ ტყეში ლომს მშვიდად ეძინა უშიშარმა თაგვმა ტანზე გადაურბინა. ლომმა გამოიღვიძა და დაიჭირა თაგვი.\n\n- გამიშვი და ოდესმე მეც გამოგადგებიო, - სთხოვა მას თაგვმა.\n\nლომმა გულიანად გადაიხარხარა და გაუშვა.\n\nგავიდა დრო ჩასაფრებულმა მონადირეებმა ლომი დაიჭირეს და თოკით ხეზე მიაბეს. უნდოდათ, მერე მოსულიყვნენ და ცოცხალი წაეყვანათ.\n\nმონადირეები რომ წავიდნენ, ლომმა საშინელი ღრიალი მორთო.\n\nთაგვს შემოესმა, მიცუნცულდა, გადაღრღნა თოკი, გაათავისუფლა ლომი და უთხრა:\n\n- გახსოვს, რომ დამცინე? ახლა ხომ ხედავ, პატარა თაგვსაც შესძლებია დიდი ლომის დახმარებაო.", "source": "docx"}, {"title": "ჭკვიანი ყვავი", "text": "ერთი სოფლის მახლობლად პატარა ტყეში ყვავი ცხოვრობდა. როცა ეს ყვავი მშიერი იყო, მაშინ იმგვარ მოხერხებულობასა და გულადობას იჩენდა, რომ მთელ სოფელს აკვირვებდა.\n\nყვავს სოფლის მცხოვრებლები მოთმინებიდანაც გამოჰყავდა. რა წამს პატარა ბატების გროვას უპატრონოდ დაინახავდა, მაშინვე უკან დარჩენილ ჭუკს თავს დაეცემოდა, მოიტაცებდა და თავის ბახალებს წაუღებდა. პატარა იხვებსა და წიწილებსაც ასევე იტაცებდა.\n\nერთხელ ერთი ქალი ბოსტანს მარგლავდა; იქვე ედო საგზლად წამოღებული ყველის კარგა მოზრდილი ნაჭერი. დაინახა თუ არა ეს ყვავმა, მაშინვე ზევიდან სწრაფად დაეშვა, ქალს არ მოერიდა, ყველი მოსტაცა და თავის ბუდეში წაიღო. პატრონმა ბევრი უკივლა, მაგრამ ყვავი არაფერს შეეპუა.\n\nერთი თავადის ყანაში გლეხები მუშაობდნენ და საუზმე ჯიბით თან მიჰქონდათ ხოლმე. როცა მზე მაღლა ავიდოდა, ტანისამოსს იხდიდნენ და მიჯნაზე აწყობდნენ. ერთხელ, მუშები რომ შორს წავიდნენ, ყვავი მიფრინდა, ჯიბეები კარგად გასინჯა, ერთი ჯიბიდან საუზმე ამოიღო და წაიღო.\n\nამხანაგებმა გაძარცვულს დასცინეს და უთხრეს: ჩვენ ასეთი სასაცილო საქმე არ მოგვივაო. მეორე დღეს მათ თავიანთი ტანსაცმლის ჯიბეები შიგნიდან მოაქციეს და ზემოდან კალთები წააფარეს.\n\nყვავმა მუშებს უთვალთვალა და როცა ისევ შორს წავიდნენ, ტანისამოსთან მიფრინდა, ნისკარტით კალთები გადახადა, ჯიბიდან საჭმელი ამოიღო, ჯერ თვითონ დანაყრდა და მერე თავის შვილებსაც კარგი სადილი წაუღო.  მეტი ძალა არ იყო, მუშებს ტანისამოსზე ისეთი დიდი ქვები უნდა დაეწყოთ, რომ ყვავს გადაგორება ვერ შესძლებოდა.\n\nამის შემდეგ ჭკვიანმა ყვავმა დიდი ყურადღება მიაქცია ტანსაცმლის ჯიბეებს და ყოველთვის სინჯავდა, როცა კი ჯიბიან ტანსაცმელს სადმე უპატრონოდ დაინახავდა.\n\nსოფლის მცხოვრებლებმა ერთ მარჯვე მონადირეს სთხოვეს, რომ ეს ყვავი მოეკლა, მაგრამ უარი მიღეს, რადგან მონადირე ყვავის ჭკუით ძლიერ გაკვირვებული და აღტაცებული იყო.", "source": "docx"}, {"title": "მეზობლები", "text": "ერთხელ ივანეს ცხენი მეზობლის ყანაში გადავიდა.\n\nმეზობელი გაბრაზდა, დაიჭირა ცხენი და პატრონს ზარალი ერთი სამად გადაახდევინა.\n\nგავიდა რამდენიმე დღე. ახლა იმ მეზობლის ხბო გადმოვიდა ივანეს ბოსტანში და მწვანილი სულ გაუოხრა.\n\nივანემ დაიჭირა ხბო, მიუყვანა მეზობელს და უთხრა: - აი შენი ხბო, ჩემი ბოსტნიდან მოგიყვანე. ჩაიბარე, მეზობლებს ჩხუბი არ შეგვშვენისო .\n\nგაახსენდა მეზობელს თავისი საქციელი, შერცხვა და ივანეს გადახდილი ფული უკანვე დაუბრუნა.", "source": "docx"}, {"title": "უფროსი და უმცროსი ძმა", "text": "ერთ დედ-მამას ორი ვაჟის მეტი არავინ გააჩნდა. ერთი ვაჟი მეორეზე ბევრად უმცროსი იყო. უცებ უფროსი მძიმედ გახდა ავად და სიკვდილის პირზე იყო მისული.\n\nმამას ძლიერ ენანებოდა მზა-მზარეულად გაზრდილი შვილი და თქვა: თუ სიკვდილი აუცილებელია, ისევ უმცროსი რომ მომიკვდებოდეს, ის მირჩევნიაო.\n\nდედამ უთხრა: რომელი თითიც უნდა მოგვჭრან, სულ ერთია, ყველა ერთნაირად გვეტკინებაო", "source": "docx"}, {"title": "ვანო და ფრინველები", "text": "ერთ პატარა ქალაქში სკოლა იყო გამართული. იმ სკოლაში სწავლობდა სოფლელი პატარა ვანო.\n\nერთხელ ვანომ ღამის ძილში მეტად საამური სიზმარი ნახა: ვითომც დილით ადრე მიირბინა მდინარის ნაპირზე, რომელიც ქალაქს გვერდით ჩაუდიოდა, და პირის ბანა დაიწყო.\n\nუცებ დედა მოაგონდა და ძლიერ დაღონდა. თვალცრემლიანმა ყურება დაიწყო თავისი სოფლისაკენ. ერთიც ვნახოთ, დაინახა იქიდან მომფრინავი ჩიტები.\n\nვანომ ჩიტებს შესძახა:\n\n\"ჰე, ჩიტებო, ჩიორებო. მალხაზნო და ნაცარებო!\n\nსად ჰყოფილხართ, რა გინახავთ, დედაჩემი არ გინახავთ?\"\n\nჩიტებმა მხიარულად ჩამოსჭყივლეს:\n\n\"დედაშენი ამ დილაზე ბანზე იყო გადმომდგარი\n\nდა ჭრელს წინდებს ვანოსათვის ქსოვდა ტკბილად მომღიმარი.\"\n\nმერე მოფრინდა მერცხალი. ვანომ იმასაც შესძახა:\n\n\"მერცხალო, კუდმაკრატელა, მოჭიკჭიკე, მონავარდე!\n\nსად ჰყოფილხარ, დედაჩემი არ გინახავს, თუ გიყვარდე?\"\n\nმერცხალმა ალერსიანად ჩამოსჭიკჭიკა:\n\n\"თქვენი სახლის ერთ კუთხეში ბუდე მქონდა ანაშენი\n\nდა ყოველთვის თვალწინ მედგა მხნე, გამრჯელი დედაშენი.\n\nახალუხს რომ უკერავდა ვანოს დიდი სიამითა,\n\nმე მაღლიდან დავმღეროდი, ვჭიკჭიკებდი ტკბილი ხმითა.\"\n\nბოლოს მოფრინდა ბულბული. ვანომ ამასაც შესძახა:\n\n\"შენ, ბულბულო, მგალობელო, ქვეყნად სწორი რომ არა გყავს,\n\nსად ჰყოფილხარ, სიდგან მოხვალ, დედაჩემი არ გინახავს?\"\n\nბულბულმა მშვენივრად ჩამოუსტვინა:\n\n\"დედაშენი? როგორ არა! ბაღში ვნახე მე ამ ხანად,\n\nლოყაწითელ ვაშლებს კრეფდა ვანოსათვის გასაგზავნად.\"\n\nამ საამურმა სიზმარმა ისე ძალიან გაახარა ვანო, რომ გამოიღვიძა, გათენებულიყო კიდეც. ადგა საჩქაროდ, პირი დაიბანა, წიგნები ხელში აიღო და მხიარულად მიირბინა სკოლაში.\n\nვანო სიხარულით ფეხზე აღარ იდგა და დედისაგან მოელოდა ჭრელ წინდებს, ლამაზ ახალუხს და წითელ ვაშლებს. თვითონაც ცდილობდა, კარგად ესწავლა და თავისი საყვარელი დედა გაეხარებინა.", "source": "docx"}, {"title": "თავდადებული მღვდელი თევდორე", "text": "მტრის შემოსევა საქართველოში\n\nსამასი წლის ამბავს მოგითხრობთ. 1609 წელი მოდიოდა, ცხელი ზაფხული იდგა. მთელი ჩვენი საქართველო ცხარე მუშაობას მისცემოდა. შიში არსაიდან იყო. არც სპარსეთს და არც ოსმალეთს იმ ჟამად საქართველოსთან სადაო არა ჰქონდათ რა. ამიტომ ქართველები მტრის შემოსევას არსაიდან არ მოელოდნენ და გულდამშვიდებულნი ადგნენ თავის შინაურს საქმეებსა.\n\nუცებ ჯავახეთისა და თრიალეთის მხრივ ქართველობაში საშინელი ჩოჩქოლი შეიქმნა. მცხოვრებლებმა თავი ანებეს ყანებსა, ბაღებსა, ყველა სამუშაოსა და იწყეს ფაციფუცით ურმების შებმა, ცხენების შეკაზმვა და თავისი ქონების გამოზიდვა სახლებიდან. ყველანი ეშურებოდნენ დაბურულის ტყეებისაკენ დასამალავად.\n\nრა იყო მიზეზი ამ დაწიოკებისა? სრულებით მოულოდნელი შემოსევა საქართველოში თათრის ჯარისა სამხრეთის მხრივ.\n\nსაიდან გაჩნდა ეს ჯარი ასე მოულოდნელად?\n\nიმ ჟამად სპარსეთსა და ოსმალეთს ომი ჰქონდათ ერთმანეთთან ბაღდადის ქალაქის გამო. ორივე სახელმწიფოს უნდოდა დაეჩემებინა ეს მდიდარი ქალაქი. ოსმალეთის მხარე დაიჭირა ყირიმის ხანმა და ყირიმის ჯარებმა დაამარცხეს სპარსელები და წაართვეს სამუდამოდ ბაღდადი. ამ გამარჯვების შემდეგ ყირიმის ძლევამოსილმა ჯარმა სწრაფად გამოილაშქრა საქართველოსაკენა.\n\nამ დროს ჩვენს ქვეყანაში მეფობდა ახალგაზრდა მეფე ლუარსაბი. იმ ჟამად ის იყო საზაფხულოდ გასული სოფელს ცხირეთში, რომელიც იყო სოფელ ახალქალაქის (1) თავსა. მთის ფერდოები, მშვენიერი გრილი ჰავა, ცივი კამკამა წყაროები, აყრილი ტყეები, კარგი სანადიროები ჰხდიდნენ ამ მაღლობ ადგილს საუცხოვო სამყოფლად ზაფხულში. ყმაწვილი მეფე განცხრომით სტკბებოდა და ფიქრადაც არ მოუვიდოდა, თუ ხიფათი ასე ახლო იყო. ლუარსაბს თან ახლდნენ ზოგნი დიდებულნი და მათ შორის გიორგი სააკაძე, პირველი ვაჟკაცი მაშინდელის დროისა, სახელოვანი წინამძღოლი ჯარისა, შემდეგ წოდებული დიდმოურავად.\n\nთათრის ჯარმა იცოდა, საზაფხულო ბინა მეფისა და საოცარი სისწრაფით მიეშურებოდა მისკენ. მტერნი მოწადინებულნი იყვნენ, უცებ დასხმოდნენ მეფესა თავსა და შეეპყროთ იგი ტყვედ, მას უკან ადვილად დაეჭირათ სოფლები, ქალაქები და ბატონობა ეწყოთ საქართველოში.\n\nთათრებმა გადმოლახეს თრიალეთი, უწიეს მანგლისსა და რამდენსამე საათის შემდეგ უნდა თავს დასხმოდნენ მეფეს, რომელმაც სრულებით არაფერი იცოდა მტრის მიახლოებისა და არც ჯარი ჰყავდა თავისთანა. თათრებს შეეძლოთ ადვილად სწეოდნენ გულის წადილსა, რადგანაც ცხირეთსა და მანგლისს შუა მხოლოდ ერთი მთა იყო და სულ ოთხი, ხუთი საათის სავლელი იქნებოდა.\n\nთავდადება თევდორე მღვდლისა\n\nმანგლისიდან ახალქალაქისაკენ რამდენიმე გზა მიდიოდა, მაგრამ ძლიერ ცუდი, ვიწრო, აღმართ-აღმართი, ოღრო-ჩოღრო. თათრებმა არ იცოდნენ, რომელი უფრო მოკლე და ვარგისი გზა იყო და ყოყმანი შეექმნათ. ამ დროს მანგლისის ახლოს ერთს პატარა სოფელში, რომელსაც სახელად კველთა ერქვა, მათ შეიპყრეს ერთი ქართველი მღვდელი, სახელად თევდორე, რომელიც ამ დროს ეკლესიას ჰკეტავდა. სხვებთან ერთად მას ტყეში გაქცევა ვერ მოესწრო, უთუოდ იმიტომ, რომ უნდოდა ეკლესიის განძეულობა კარგად მიემალნა და მტრის ხელიდან გადაერჩინა.\n\nთევდორე მღვდელს შეუტიეს თათრებმა და უბრძანეს: შენ უნდა წინ წაგვიძღვე, სულ მოკლე გზით გვატარო და რაც შეიძლება, ჩქარა მიგვიყვანო მეფის ბინასთანაო. თუ ამას შეგვისრულებ, დიდს საჩუქარს მიიღებ; ხოლო თუ უარზე დადგები, გტანჯავთ, გაწვალებთ, საშინელს სიკვდილს მიგცემთ და შენს სხეულს ყვავსა და ყორანს შევაჭმევთო.\n\nმღვდელი სწორედ ჯოჯოხეთის ცეცხლში ჩავარდა. თუ თათრებს ნებას დაყვებოდა, მეფეს დაატყვევებდნენ, საქართველოს ააოხრებდნენ, სისხლით და ცრემლით აავსებდნენ.\n\nქვეყნის უბედურებას გააორკეცებდა ის გარემოება, რომ მეფე ჯერედ სულ ყმაწვილი იყო, მეუღლე არა ჰყავდა და მემკვიდრე არ დარჩებოდა. ამის გამო ურჯულონი უფრო მაგრა მოიკიდებდნენ ფეხს საქართველოში და მონობის უღელს დაადგამდნენ ჩვენს ერსა.\n\nთუ თევდორე უარს ეტყოდა, სამშობლოს ვერ გამოიმეტებდა, მას მოელოდა გამოუთქმელი ტანჯვა, წამებით სიკვდილი, ყვავ-ყორნისაგან შეჭმა და დაობლება ცოლ-შვილისა, მესამე გზა ყოვლად შეუძლებელი იყო. ან თავი უნდა შეეწირა ქვეყნისათვის, ან სამშობლო ენაცვლებინა თავისი თავისათვის.\n\nპირველს წამებში მღვდელი ყოყმანობამ შეიპყრო და ვერ გადაეჭრა, რომელს გზას დასდგომოდა. ამ ყოყმანობის დროს მას საცოდავი, შესაბრალისი სახე ჰქონდა, მაგრამ უცებ იგი წელში გასწორდა, სახე გაუნათდა, მამაცური გამომეტყველებით აევსო. აშკარად ეტყობოდა, რომ გმირულ გადაწყვეტილებას დაადგა.\n\nთათრებს უთხრა თევდორემ: კარგი, მომყევით და სულ მოკლე გზით გატარებთ მეფემდისაო. თათრებს დიდი სიხარული შეუდგათ და ფიქრობდნენ, რამდენიმე საათის შემდეგ საქართველოს მეფე ხელში გვეყოლება ტყვედაო.\n\nმიდის წინ მღვდელი, მისდევენ მას უკან თათრები. ესენი ხედავენ, რომ სულ დასავლეთისაკენ მიჰყავს მღვდელსა, ცხირეთი კი მანგლისიდან ჩრდილოეთით სძევს. ეჭვი ეპარებათ, მაგრამ თან ფიქრობენ: აი, საცაა, გზა ჩრდილოეთისაკენ გაუხვევსო. ხოლო თევდორე მღვდელი სულ იქით და იქით მიდის და, რაც შეიძლება, სწრაფად, იარეს ასე კარგა ხანს.\n\nბოლოს თათრები მიხვდნენ, რომ თევდორე მღვდელმა ისინი მოატყუა, გზას ააცდინა და ცხირეთს დააშორა. მაშინ ისინი საშინელი სიბრაზით აივსნენ, გაშმაგებულნი მისცვივდნენ საწყალს თევდორეს და დაუწყეს წამება.\n\nაწვალეს, სტანჯეს, ბოლოს მოჰკლეს, დაჩეხეს და გადააგდეს ერთ დიდს ხრამში. თევდორე მღვდელი ამ საშინელის ტანჯვის დროს მხურვალე გულით ევედრებოდა უფალსა, რათა მას მოწყალე თვალით გადმოეხედნა საქართველოსათვის, მისი სახლობისათვის და ეხსნა იგინი მტერთა ხელისაგან. ლოცვა და იმედი არ გაუცრუვდა, თავდადებამ მისმა ჯეროვანი ნაყოფი გამოიღო.\n\nბრძოლა ქართველებისა და თათრებისა\n\nთევდორე მღვდელმა ისე დააშორა თათრები ცხირეთსა, რომ მათ იმ დღეს ვეღარ გაიგნეს გზა და ვერ მოასწრეს მთაზე გადასვლა. ამით ისარგებლა ზოგიერთმა გამბედავმა ქართველმა, მოკლე ბილიკებით მოჰკურცხლეს ცხირეთისაკენ და აცნობეს მეფეს ყველაფერი.\n\nგიორგი სააკაძე, როგორც წინამძღოლი ჯარისა, იმავ წამს თადარიგს შეუდგა. აფრინა ცხენოსანნი სოფლებსა და დაბებში და დაუძახა ჯარსა. მეორე დილა ჯერედ კარგად არ გათენებულიყო, რომ ახლომახლო სოფლებიდან მეფის გარშემო დაიბადა გამოწყობილი ჯარი.\n\nმაშინდელს დროში ყოველს ასაკოვანს ქართველს თოფ-იარაღი ჰქონდა, ომის საქმე კარგად იცოდა და დაძახების შემდეგ ფიცხლავ გამოცხადდებოდა ხოლმე საომრად დანიშნულს ადგილსა.\n\nმეორე დილას თათრის ჯარი მაღლა მთებიდან ახალქალაქისაკენ მუქარით და მრისხანებით დაეშვა. მაგრამ ახლა იგი ისე საშიში აღარ იყო. ქართველების ჯარი მხნედ დაუხვდა, თუმცა ჯერ მცირე იყო რიცხვით, მაშინ როდესაც მტერთა რიცხვი ოცდა ათი ათასს აღემატებოდა.\n\nგაჩაღდა ბრძოლა. თავდაპირველად ქართველებს ომი მეტად უჭირდათ იმის გამო, რომ ერთს ქართველზე ოცობით მოდიოდნენ თათრები, მაგრამ ჩვენებს წინ უძღოდათ საოცარი მეომარი სააკაძე და ამასთან თანდათან ღონეც მიიცეს, რადგანაც აქეთ-იქით სოფლებიდან გუნდ-გუნდად მოდიოდნენ შეიარაღებული ქართველნი.\n\nთათრებმა პირი დასავლეთისკენ ჰქმნეს, უნდოდათ, სწრაფად მისდგომოდნენ გორსა, გასულიყვნენ ხიდზე, რომელიც იდო მტკვარზე ხიდისთავსა და გორს შუა, აეღოთ გორი, აეკლოთ და დაეჭირათ ამ ქალაქის ციხე, ჩაეყენებინათ შიგ თავისი ჯარი და შემდეგ შესდგომოდნენ მთელი საქართველოს დაპყრობასა.\n\nგიორგი სააკაძე ძლიერ ცდილობდა, როგორმე დაეწინაურებინა ერთი გუნდი ქართველი ჯარი, რომ მას წინ ეყელა თათრებისათვის და გორის ხიდი ჩაეშალა; მაგრამ მტერი აბა ამის ნებას რად მისცემდა? გარნა აქაც ხელი შეუშალა თათრებს მეორე სასულიერო პირმა.\n\nგორი გადაურჩება თათრებსა\n\nთათრების ჯარის შემოსევაზე გორში სრულიად არაფერი იცოდნენ, ისე მოულოდნელი იყო ყველასათვის ეს შემოსევა. ამიტომ გორიდან არხეინად მოდიოდა ცხენით სომხის მღვდელი სააკაშვილი სოფელს დოესში, სადაც ქართველებთან სომხებიც ცხოვრობდნენ და მიწერილნი იყვნენ გორის მრევლზე.\n\nროცა სააკაშვილი ავიდა ზედაველის მაღლობს მინდორზე, საშინელი სანახავი გადაეშალა თვალწინ: თითქმის მთელი ვეებერთელა ვაკე მთებსა და მტკვარს შუა მჭიდროდ იყო დაჭერილი თათრის ჯარითა.\n\nელდანაცემმა მღვდელმა ფიცხლავ ცხენი უკან გამოაბრუნა, ჰკრა დეზი და გააჭენა უკან გორისაკენ. მიიჭრა ხიდთან, სწრაფად გადმოხტა ცხენიდან და დაიძახა: \"არიქა, მიშველეთ, ხიდი ჩავშალოთ, აგერ მტრის ჯარი მოდისო\", და თანაც ხელი მიჰყო ხიდის ჩაფუშვასა.\n\nბედად, იქვე შეესწრნენ ხიდისთაველი გლეხები. ესენიც მისცვივდნენ ხიდსა და დაუწყეს საჩქაროდ ჩაშლა. როცა პატარა ხანს უკან თათრები ხიდს მიუახლოვდნენ, ხიდი ჩაფუშული დახვდათ და ძლიერ ცუდს მდგომარეობაში ჩაცვივდნენ. უხიდოდ გორში გასვლა შეუძლებელი იყო, რადგან მტკვარი ადიდებული მოდიოდა;\n\nიქითა ნაპირას საჩქაროდ გროვდებოდა ქართველი გორელი ჯარი, რომელნიც ნებას არ მისცემდა თათრებს ახალი ხიდი გაეკეთებინათ და ისე გასულიყვნენ. უკან, თბილისისაკენ, ვერ დაბრუნდებოდნენ, რადგანაც ზურგთ უკან მათ ედგათ გიორგი სააკაძე თავის ჯარითა და საქმეს უჭირებდა.\n\nრა უნდა ექმნათ? მეტი ღონე არ იყო, საქართველოს დაპყრობაზე ხელი უნდა აეღოთ და თავი როგორმე დაეხწიათ. გადაწყვიტეს, ევლოთ დასავლეთისაკენ, ზემო ქართლის სოფლები დაერბიათ, დავლა ბევრი ეშოვნათ და შემდეგ ბორჯომის ხეობით, რომელზედაც მიდიოდა ახალციხის გზა, სათათრეთში დაბრუნებულიყვნენ. მაგრამ ისინი სააკაძესა და ქართველებს არ იცნობდნენ ჯერ კარგადა.\n\nთათრის ჯარის ამოჟლეტა\n\nწინ მიდიოდა თათრის ჯარი, უკანიდან მოსდევდა ფეხდაფეხ ქართველი ჯარი და ჟლეტდა, რაც კი შეეძლო.\n\nთათრები ქარელს ახლო მტკვარში გავიდნენ. მოექცნენ იქითა, მარცხენა ნაპირზე და შეესივნენ ზემო ქართლის სოფლებს დასარბევად. სააკაძემ ამითი მარჯვედ ისარგებლა. მან მტრის დევნას თავი დაანება, თავისი ჯარი სწრაფად, დაუსვენებლივ ატარა მტკვრის მარჯვენა ნაპირსა და, როცა ასცდა ტაშის კარსა, საიდანაც იწყება ბორჯომის ხეობა, ერთბაშად ცურვით გავიდა მთელი თავისი ჯარით მტკვარში, უყელა წინ თათრებსა და გადაეღობა გზაზე.\n\nაი თათრის ჯარი, დავლით დატვირთული, ბორჯომის ხეობაში შევიდა. მაგრამ ვაი ამ შესვლას. სწორედ იმ დროს ზემო ქართლის ერისთავები თავისი ჯარებით მტერს უკანიდან მიადგნენ.\n\nთათრები ისე მოემწყვდნენ, როგორც ჩიტი გალიაში. წინ-უკანიდან ქართველი ჯარი ედგათ, დასავლეთით იყვნენ აყუდებულნი მაღალნი გაუვალნი მთები, აღმოსავლეთით მოჰქუხდა ადიდებული მტკვარი.\n\nდაიწყო ბრძოლა. თათრები სასოწარკვეთილებით იბრძოდნენ, დიდი სიმამაცე გამოიჩინეს, მაგრამ ვერას გახდნენ. ბრძოლა გაგრძელდა მთელს სამს დღესა.\n\nსააკაძე იბრძოდა, როგორც ლომი, და დიდი ოსტატობით წინ უძღოდა ჯარსა. თათრები ერთი ოთხად მეტნი იყვნენ ქართველებზედა, მაგრამ მაინც საშინლად დამარცხდნენ;\n\nიმოდენა ჯარი მტრისა თითქმის მთლად ამოიჟლიტა, მცირე ნაწილი ტყვედ ჩაუვარდათ ხელში ქართველებსა. ზოგნი ტყეში შეიმალნენ. მაგრამ ესენიც ისე იყვნენ შეშინებულნი და თავზარდაცემულნი, რომ ბრძოლის გათავების შემდეგ მეორე-მესამე დღეს ბავშვები და ქალები იჭერდნენ ტყეებში და გამოჰყავდათ.\n\nიმოდენა ჯარიდან გადარჩა მხოლოდ თორმეტი კაცი და თავს უშველა, რათა სამშობლოში მიეტანა საზარელი ამბავი.\n\nასეთი უდიდესი სიკეთე შესძღვნა სამშობლოს თევდორე მღვდელმა თავისი დიდებული ღვაწლით, თავდადებით.\n\nამ სახელოვანს მამულის შვილს რომ თავი არ გამოემეტნა, მეფეც დატყვევებული შეიქმნებოდა, ქვეყანაც აოხრებული; ბევრი დედა, ბევრი მეუღლე, ბევრი და და ძმა ატირდებოდა საქართველოში. თვითონ ეს მღვდელი თავისი ცოლ-შვილით საუკუნოდ წყეულ და შეჩვენებული შეიქმნებოდა ყველასგან და ისეთ სირცხვილში ჩავარდებოდა, რომ სიკვდილი ბევრად სჯობია იმისთანა სიცოცხლესა.\n\nახლა? ახლა კი მეფე გამარჯვებული შეიქმნა, ქვეყანა გამოხსნილი, მტერი შემუსვრილი და მთელს საქართველოში სიხარული დატრიალდა.\n\nდაობლებულს ცოლ-შვილს თავდადებულისას მეფე და ქვეყანა პატრონად და მფარველად აღმოუჩნდნენ და თვითონ თევდორე მღვდელმა მოიპოვა იმისთანა სახელი, რომელიც ქებით, დიდებით და კურთხევით იხსენება ყველა ქართველისაგან, ვიდრე დედამიწის ზურგზე ჩვენი ერი იცოცხლებს.\n\nდიახ, თევდორე მღვდელმა თავის თავზე აიცხადა დიდებული რუსთველის ლექსი: \"სჯობს სიცოცხლესა ნაზრახსა სიკვდილი სახელოვანი!\"", "source": "docx"}, {"title": "ორი მეგობარი და დათვი", "text": "ორი მეგობარი მიდიოდა. წინ დათვი შეხვდათ. ერთი მაშინვე ხეზე ავიდა და იქ დაიმალა.\n\nმეორე მარტო დარჩა. გაქცევა ვერ მოასწრო. მიწაზე დაეცა და თავი მოიმკვდარუნა, რადგან იფიქრა, რომ დათვი მკვდარს არაფერს დაუშავებდა.\n\nდათვი მივიდა და ყური დაადო.\n\nკაცმა სუნთქვა შეიკავა. დათვმა მართლაც თავი დაანება და წავიდა.\n\nმეორე კაცი ხიდან ჩამოვიდა და ამხანაგს ჰკითხა:\n\n- დათვი ყურში რას გეჩურჩულებოდა?\n\n- მან მირჩია, ისეთ ადამიანს ნუღარ დაუმეგობრდები, რომელიც გასაჭირში მიგატოვებსო. - უპასუხა მან.", "source": "docx"}, {"title": "ჭორის მსხვერპლნი", "text": "იგავ-არაკი\n\nლევ-ტოლსტოის მიხედვით\n\nერთ დიდ ტყეში, მაღალ მუხაზე, ერთმა არწივმა ბუდე გაიკეთა, მერე კვერცხები დადო და პატარა მართვეები გამოჩეკა. იმავე მუხის ქვეშ გარეულმა ღორმა ბუნაგი გაიკეთა და გოჭები დაყარა.\n\nარწივი ყოველდღე სანადიროდ დაფრინავდა და საჭმელს უზიდავდა თავის მართვეებს, ღორი მუხის გარშემო მიწას ჩიჩქნიდა, ტყეში დადიოდა და საღამოობით საჭმელი მოჰქონდა თავისი გოჭებისათვის. ასე მშვიდობიანად ცხოვრობდნენ მეზობლები.\n\nიმავე ტყეში ცხოვრობდა ერთი გარეული კატა, რომელიც მეტად ცბიერი იყო და მშვიდობის მოყვარული მეზობლების  წაჩხუბება მოინდომა. ამისათვის მან ჭორიკნობა დაიწყო:\n\nმივიდა არწივთან და მოახსენა:\n\n- შენ,  არწივო, ფრთხილად იყავი! შორს ნუ დაფრინავ, თვალი ადევნე შენს მტერ ღორს, იმ მუხას ძირს უთხრის, უნდა წააქციოს და მართვეები შეგიჭამოსო.\n\nმერე წავიდა ღორთან და უთხრა:\n\n- ღორო, შენ ძლიერ საშიში მეზობელი გყავს. გუშინ შემთხვევით ყური მოვკარი მის სიტყვებს; არწივი თავის მართვეებს ეუბნებოდა: შვილებო, კარგად იყავით, ხვალ, როცა ღორი შორს წავა, დავავლებ კლანჭებს მის ერთ გოჭს და საუზმედ ამოგიტანთო.\n\nკატის ეშმაკობამ გაჭრა: არწივს შეეშინდა ღორის, ღორს კი - არწივის, ვერც ერთი ვეღარ ტოვებდა შვილებს და დღეებს ერთმანეთის დარაჯობაში ატარებდნენ. ბარტყები და გოჭები საჭმელის გარეშე დარჩნენ და მალე შიმშილისაგან დაიხოცნენ.\n\nცბიერ კატასაც ეს უნდოდა, გადმოაგდებდნენ თუ არა მკვდარ მართვეს ან გოჭს, მაშინვე მივარდებოდა და შეჭამდა.\n\nუბედურ არწივსა და ღორს ერთი შვილიც აღარ შერჩათ, ჭორიკანა კატამ კი მუცელიც გაიძღო და ქონიც გაისქელა.", "source": "docx"}];

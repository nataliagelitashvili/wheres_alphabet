ისა და ივანეს თანხა დაუბრუნა."], ["ჭორის მსხვერპლნი", "მუხაზე არწივი თავის მართვეებთან ცხოვრობდა, მის ძირში კი გარეული ღორი გოჭებს ზრდიდა. ორივე საკვების მოსაპოვებლად დადიოდა. გარეულმა კატამ მათ შორის შუღლის ჩამოგდება გადაწყვიტა. არწივს უთხრა, რომ ღორი ხის წაქცევას აპირებდა, ღორს კი არწივის თავდასხმით შეაშინა. ორივე მშობელი შვილების დარაჯობას შეუდგა და საკვების საძებნელად აღარ მიდიოდა. მათი ნაშიერები შიმშილით დაიხოცნენ, კატამ კი ისინი შეჭამა."], ["იას სოფლის ამბების შეჯამება", "კატოს მზრუნველობა, დედის თანაბარი სიყვარული, მეზობლების ურთიერთობა და ტყის კატის ჭორი განსხვავებულ სიტუაციებს გვიჩვენებს. დაფიქრდი, როგორ ეხმარება ადამიანებს ერთმანეთის მოსმენა, ფაქტების გადამოწმება და თანამშრომლობა."], ["მგელი და წერო", "მგელს ყელში ძვალი გაეჩხირა. მან წეროს დახმარება სთხოვა და ჯილდოს დაჰპირდა. წერომ გრძელი ნისკარტით ძვალი ამოიღო. როდესაც ჯილდო მოითხოვა, მგელმა დახმარების დაფასების ნაცვლად უთხრა, რომ უვნებლად გადარჩენაც საკმარისი იყო."], ["ორი მეგობარი და დათვი", "ორი მეგობარი გზად დათვს შეხვდა. ერთი ხეზე ავიდა, მეორე კი მიწაზე დაწვა და თავი მკვდრად მოაჩვენა. დათვი მიუახლოვდა და შემდეგ წავიდა. განსაცდელმა გამოაჩინა, რამდენად სანდო იყო მეგობარი, რომელმაც თანამგზავრი მარტო დატოვა. ეს იგავია და არა ნამდვილ დათვთან მოქცევის ინსტრუქცია."], ["ლომი და თაგვი", "ტყეში მძინარე ლომს თაგვმა გადაურბინა. ლომმა დაიჭირა იგი. თაგვმა გათავისუფლება სთხოვა და მომავალში დახმარება აღუთქვა. ლომს გაეცინა, თუმცა გაუშვა. მოგვიანებით მონადირეებმა ლომი ხეზე თოკით მიაბეს. მარტო დარჩენილმა ლომმა ღრიალი დაიწყო. თაგვმა მისი ხმა გაიგონა, მივიდა, თოკი გადაღრღნა და ლომი გაათავისუფლა. ასე დაუმტკიცა, რომ პატარასაც შეუძლია ძლიერის დახმარება."], ["მელია და ქოთანი", "მელიამ საჭმლის მოსაპოვებლად ქოთანში თავი შეყო. ჭურჭელი თავზე გაეჭედა და მელია მის მოცილებას ცდილობდა. დაუფიქრებელმა მოქმედებამ ახალი საფრთხე შექმნა. დაფიქრდი, როგორ შეიძლებოდა თავიდან აეცილებინა ეს მდგომარეობა."], ["ჭრიჭინა და ჭიანჭველა", "თბილ დღეებში ჭიანჭველა საკვებს აგროვებდა, ჭრიჭინა კი მღეროდა. როცა ზამთარი მოვიდა, საკვების მოპოვება გართულდა. იგავი მომავლისთვის მზადებას გვახსენებს. ასევე შეგვიძლია ვიმსჯელოთ, როგორ დავეხმაროთ გაჭირვებულს გონივრულად."], ["ერთი მერცხლის ჭიკჭიკი (მერცხალი და მეცხვარე)", "ზამთარი დასასრულს უახლოვდებოდა. ნაკადულები ადიდდა და ყვავილები თოვლიდან გამოჩნდა. ერთი მერცხალი თბილი ქვეყნებიდან სხვებზე ადრე დაბრუნდა. მეცხვარემ მისი ხმა გაიგონა და იფიქრა, რომ გაზაფხული დადგა. ცხვრებს მატყლი გაკრიჭა. მეორე დღეს თოვლი და ყინვა დაბრუნდა, ფარა კი ძლივს გადარჩა. მეცხვარე მიხვდა, რომ ერთი მერცხლის გამოჩენა გაზაფხულის დადგომას არ ადასტურებს."], ["ვანო და ფრინველები", "ვანო მშობლიურ სახლს და დედას ნატრობს. ფრინველების სახეები მას მშობლიურ გარემოს ახსენებს. ამ ამბის მიხედვით დაფიქრდი, რა განცდებს შეიძლება გამოხატავდეს ფრინველი და როგორ გვაკავშირებს ბუნება მოგონებებთან."], ["მერცხალი", "მერცხალი მფრინავი მწერებით იკვებება და ხშირად შენობებთან იკეთებს ბუდეს. სეზონის ცვლილებასთან ერთად ბევრი მერცხალი თბილ მხარეში გადადის. ასეთ სეზონურ გადაადგილებას მიგრაცია ეწოდება."], ["ბეღურა", "ბეღურა პატარა ფრინველია, რომელსაც ხშირად ადამიანის საცხოვრებელთან ვხვდებით. ფრინველებზე დაკვირვებისას ჩაინიშნე დრო, ადგილი და რაოდენობა. დააკვირდი შორიდან, მშვიდად, ისე რომ ფრინველი არ შეაწუხო."], ["ჭკვიანი ყვავი", "ყვავებს შეუძლიათ საკვების ადგილების დამახსოვრება და გამოცდილებით სწავლა. წარმოიდგინე, რომ ფრინველმა რამდენიმე ადგილიდან უნდა იპოვოს საკვები. როგორ დაეხმარება მას დაკვირვება და მეხსიერება?"], ["იავნანამ რა ჰქმნა?! — ბავშვობა", "ქეთო მშობლებთან, ზურაბთან და მაგდანთან იზრდება. დედის ხმა და იავნანა მის ადრეულ ბავშვობას უკავშირდება. დედის სიმღერა ბავშვისთვის სიყვარულისა და უსაფრთხოების განცდას ქმნის."], ["იავნანამ რა ჰქმნა?! — განშორება", "ქეთოს იტაცებენ და იგი მშობლიურ ოჯახს შორდება. სხვა გარემოში იზრდება და ადრეული ბავშვობის მოგონებები თანდათან უფერმკრთალდება. მშობლებისთვის შვილის დაკარგვა დიდი ტკივილია."], ["იავნანამ რა ჰქმნა?! — ორი ოჯახი", "როდესაც ქეთო მშობლიურ ოჯახს უბრუნდება, მისთვის ნაცნობი აღმზრდელი ოჯახისგან დაშორება მძიმეა. მშობლებს შვილის დაბრუნება ახარებთ, მაგრამ ქეთოსთვის ახალ გარემოსთან შეგუებას დრო სჭირდება."], ["იავნანამ რა ჰქმნა?! — იავნანა", "მაგდანი ქეთოს ძველ იავნანას უმღერის. დედის ნაცნობი ხმა ბავშვობის მოგონებებს აღვიძებს და მათ შორის ემოციურ კავშირს აღადგენს. სიმღერა ნაწარმოების მნიშვნელოვანი გარდატეხის საფუძველი ხდება."], ["იავნანამ რა ჰქმნა?! — სიყვარულის ხიდი", "ქეთოს ამბავი გვაფიქრებს ოჯახზე, მეხსიერებასა და მშობლიური გარემოს მნიშვნელობაზე. საკუთარი ოჯახის და კულტურის სიყვარული სხვა ადამიანებისადმი მადლიერებასა და პატივისცემას არ გამორიცხავს."], ["ცოტნე დადიანი", "მონღოლთა ბატონობის დროს ქართველი დიდებულები შეიკრიბნენ. მათი ნაწილი შეიპყრეს. ცოტნე, რომელიც დატყვევებული არ იყო, განსაცდელში მყოფ თანამემამულეებს შეუერთდა. მისმა მოქმედებამ ერთგულება და თანადგომა გამოავლინა."], ["ერეკლე მეფე და ინგილო ქალი", "ერეკლე მეფისა და ინგილო ქალის შეხვედრის ამბავი მეფეს ადამიანებთან ურთიერთობისას წარმოაჩენს. ლიდერის შეფასებისას მნიშვნელოვანია არა მხოლოდ მისი წოდება, არამედ ისიც, როგორ ექცევა სხვებს."], ["ცხრა ძმანი ხერხეულიძენი", "1625 წელს მარაბდასთან ქართველთა და ირანის ჯარებს შორის ბრძოლა გაიმართა. ცხრა ძმა ხერხეულიძის ამბავი ამ ბრძოლის მეხსიერებასა და თავდადებას უკავშირდება. ბრძოლის თარიღი ისტორიული ფაქტია, გმირობის შეფასება კი მის მნიშვნელობაზე მსჯელობას მოითხოვს."], ["ასპინძის ომი", "1770 წელს ასპინძასთან ერეკლე II-ის ჯარი ოსმალთა ძალებს შეებრძოლა. ბრძოლის მიმდინარეობის გასაგებად მნიშვნელოვანია გარემო, მდინარე, გზები და სამხედრო ძალების განლაგება. ისტორიული გადაწყვეტილებები კონკრეტულ პირობებში მიიღება."], ["თავდადებული მღვდელი თევდორე", "1609 წელს მტრის რაზმი მეფე ლუარსაბ II-ის სამყოფლის მოძებნას ცდილობდა. მღვდელმა თევდორემ მტერს გზა არასწორად უჩვენა და მეფის დაცვას შეუწყო ხელი. მისი ამბავი პასუხისმგებლობასა და თავდადებას უკავშირდება."], ["ცოდნის სარკე", "ლომისა და თაგვის ამბავი დახმარების მნიშვნელობას გვიჩვენებს, ცოტნე დადიანის ამბავი — თანადგომას. ჭორის მსხვერპლთა და მეცხვარის ამბები გვახსენებს, რომ დასკვნამდე ინფორმაცია უნდა შევამოწმოთ."], ["დავიწყების ჩრდილი", "თამაშის გამოგონილ სამყაროში დავიწყების ჩრდილი წიგნების მიმართ გულგრილობას გამოხატავს. კითხვის, ცოდნის გაზიარებისა და ერთმანეთის დახმარებით მოგზაური დაკარგულ ასოებს აბრუნებს."], ["წერილი მომავალ თაობას", "წარმოიდგინე 2076 წლის მოსწავლე, რომელიც შენს წერილს კითხულობს. მოუყევი, რატომ არის ქართული ენა შენთვის მნიშვნელოვანი, რა ისწავლე მოგზაურობისას და რა გინდა მომავალ თაობას უსურვო."]];
const originalWorks = [{"title": "ცხრა ძმანი ხერხეულიძენი", "text": "თბილისის სამხრეთით, ორმოცი ვერსის მანძილზე მდებარეობს\nმოზრდილი სოფელი მარაბდა. სამასი წლის წინათ ამ სოფელში\nცხოვრობდა მოხუცი აზნაური ხერხეულიძე, რომელიც გადასახლებული\nიყო ზემო ქართლიდან და რომელსაც ცხრა ვაჟი ჰყავდა. მამა ამ ცხრა\nვაჟისა იყო ერთგული მოყვარე თავისი ქვეყნისა და მხურვალე\nმამულიშვილი. ცოლად მას ჰყავდა ყოვლად ღირსეული ქართველი\nმანდილოსანი. ამის გამო ცხრა ძმანი ერთიერთმანეთზე უკეთესი\nვაჟკაცები და მამულიშვილები დადგნენ.იმ ჟამად სპარსეთში მეფობდა\nშაჰი აბასი, მეტად აბეზარი მეომარი. მას ჰყავდა მრავალი ჯარი,\nგაწვრთნილი და გამოცდილი ლაშქრობაში. შაჰ-აბასმა დაიპყრო ბევრი\nქვეყანა და ბოლოს საქართველოშიც შემოიჭრა. ქართველთა ჯარი მას\nგადაეღობა გზაზე თბილისის მახლობლად მარაბდის სამხრეთით. ატყდა\nსაშინელი ბრძოლა. სამი დღის განმავლობაში სისხლი შეუწყვეტელ\nნაკადულებად დიოდა. თუმცა სპარსელები ერთი-ათად მეტნი იყვნენ,\nმაგრამ მათ სამი დღის განმავლობაში ქართველს ჯარს ფეხი ვერ\nმოაცვლევინეს, რადგანაც ქართველი მეომარნი თავგანწირულად\nიბრძოდნენ სამშობლოს დაცვისათვის. მეტადრე საოცარ უშიშროებას,\nსამაგალითო ვაჟკაცობას და საარაკო თავდადებულობას იჩენდნენ ცხრა\nძმანი ხერხეულიძენი, რომელნიც ერთად, მხარდამხარ ებრძოდნენ\nმტერსა, მათ სპარსელების არა ერთი იერიში უკუაქციეს, არა ერთხელ\nაქნევინეს ზურგი მტერსა, მაგრამ მეოთხე დღეს სპარსელებს ახალი ჯარი\nმოეშველა და დაღლილ-დაქანცულმა ქართველთა ლაშქარმა ვეღარ\nშეიკავა მტერი. ამ საშინელი წამის დროს ძმანი ხერხეულიძენი არამც თუ\nარ შედრკნენ, არამედ ლომებად გადაიქცნენ და უფრო მომეტებული\nთავის განწირვით იბრძოდნენ. მათ გადაწყვეტილი ჰქონდათ: — ან\nგაემარჯვათ, ან ბრძოლის ველზე დახოცილიყვნენ ყველანი. და რადგანაც\nქართველმა ჯარმა ვერ გაიმარჯვა, თავდადებულნი ძმანი,\nერთიერთმანეთზე ზედ შეაკვდნენ მტერსა და თავისი გმირული სული\n\nდალიეს ბრძოლის ველზე.ხალხის თქმულებით, მათი დედაც ბრძოლის\nველზე იყო, ამხნევებდა მათ და როცა ერთ მის ვაჟს, სასიკვდილოდ\nდაჭრილს, ქართული დროშა ხელიდან გაუვარდა, დედამ აიღო დროშა\nდა თავის მეორე შვილს მისცა ხელში.მადლიერმა ქართველებმა ეს ცხრა\nძმა იპოვნეს ბრძოლის ველზე მკვდართა შორის, თითოეული დიდი\nმოწიწებით დამარხეს ცალ-ცალკე მწკრივად და დაადვეს ცხრა დიდ-\nდიდი საფლავის ქვა, რომელიც დღემდის დაცულია.", "pages": "3–4"}, {"title": "ცოტნე დადიანი", "text": "1. მონგოლნი საქართველოში\nმეცამეტე საუკუნის შუა წლებში საქართველოსათვის თავდადებულობით\nთავი ისახელა ერთმა დიდებულმა ქართველმა, სახელად ცოტნე\nდადიანმა. აი, როგორ მოხდა ეს ამბავი.თამარ მეფის სიკვდილის შემდეგ\nარ გასულიყო ჯერ თორმეტი წელიწადი, რომ ჩვენს ქვეყანას შემოესია\nმრავალრიცხოვანი და უმძლავრესი მტერი — მონგოლები. ამ ველურმა\nხალხმა მოინდომეს საქართველოს დაპყრობა. მათ მოსთხოვეს\nქართველებს, ნებაყოფლობით დაგვიმორჩილდითო, მაგრამ ცივი უარი\nმიიღეს. მაშინ მათი ლაშქარი შემოესია ჩვენს ქვეყანას და დაიწყო\nხანგრძლივი ბრძოლა ქართველთა და მონგოლთა შორის. ქართველებმა\nდიდი ვაჟკაცობა უჩვენეს მტერს, სამშობლოს დამოუკიდებლობას და\nთავისუფლებას თავგანწირულნი იცავდნენ, მედგრად ებრძოდნენ\nმონგოლებს, ჟლეტდნენ მათ. მაგრამ მტრის სიმრავლის გამო ბოლოს\nმაინც ძლეულნი იყვნენ. გამარჯვებულმა მონგოლებმა იწყეს\nმბრძანებლობა საქართველოში და სწრაფად შესცვალეს მისი\nმდგომარეობა. ქვეყანა სწრაფად გააღარიბეს, თავისუფალს ერს ყმობის\nუღელი დაადგეს.მტერს მაინც ეშინოდა ქართველების შეერთებული\nძალისა და ყოველ ღონისძიებას ხმარობდა ჩაეშალა ქართველთა შორის\nერთობა და ამით ჩვენი ქვეყანა სამუდამოდ დაეუძლურებინა და\nდაემონავებინა. ასეც მოიქცნენ, თავისი წადილი სისრულეში მოიყვანეს.\n\nცდილობდნენ ვერაგობით მტრობა ჩამოეგდოთ და იმერნი და ამერნი\nქართველნი ერთმანეთთან შეეჯახებინათ. როცა ასე გააცალკევეს ღვიძლი\nძმები და დააუძლურეს, მაშინ მოინდომეს მეფე ჩამოეგდოთ, თვითონ\nყოფილიყვნენ პირდაპირი მბრძანებელნი ქართველებისა.\n2. კრება მამულიშვილთა\nქართველნი მამულიშვილნი ძლიერ სწუხდნენ, როცა ხედავდნენ ქვეყნის\nგანცალკევებას, უმეფობას, სისუსტეს ერისას და სულ იმის ფიქრში\nიყვნენ, რა ეღონათ. ბოლოს საქართველოს ყველა კუთხის საუკეთესო\nმამულიშვილებმა მოიხმეს ერთმანეთი და მოახდინეს კრება შუაგულს\nადგილას, ახალციხის მახლობლად. ისინი ქვეყნის შველაზე ფიქრობდნენ\nდა მსჯელობდნენ. ბოლოს, ერთხმად დაადგნენ იმ აზრს, იმ\nგადაწყვეტილებას, რომ წასულიყვნენ ყველანი თავ- თავიანთ ქვეყანაში,\nაეჯანყებინათ მცხოვრებნი,მოეკრიფათ საჩქაროდ ჯარები და მოესხათ\nისინი ახალციხის ახლოს. აქედან შეერთებელი ძალით უნდა გაელაშქრათ\nმონგოლების წინააღმდეგ, გაერეკათ ისინი საქართველოდან.\n3. დატყვევება ქართველებისა\nამ გადაწყვეტილების შემდეგ ცოტნე დადიანი გაეშურა შორეულს\nაფხაზეთში, რათა დროზე შეეკრიბა ჯარი და ვადაზე მიესწრო დანიშნულ\nადგილას. სხვანი ჯერ ერთად იყვნენ და აჯანყების წესსა და რიგს\nაწყობდნენ. მაგრამ მონგოლებმა ეს ამბავი შეიტყვეს, უთუოდ\nსულმდაბალი ჯაშუშების შემწეობით. მათ სწრაფად აფრინეს ცხენოსანი\nჯარი ახალციხისაკენ. ეს ჯარი მოულოდნელად თავს დაესხა ქართველ\nმთავრებს სწორედ იმ დროს, როდესაც ისინი აქედან წასვლას აპირებდნენ\nთავიანთ ქვეყნებში მცხოვრებლების ასაჯანყებლად. ქართველებს თან\nჯარი არა ჰყავდათ,წინააღმდეგობა ვერ გაუწიეს და დატყვევებულ იქმნენ\nყველანი ერთად. ჩვენები მტერმა წაასხა სამხრეთით, სადაც ბინა ჰქონდა\nმონგოლთა მბრძანებელს ანუ ნოინს. ნოინი რისხვითა და მუქარით\nდაუხვდა ქართველებს და მოითხოვდა მათგან, გატყდით ახლავე, რომ\nჩემს წინააღმდეგ აჯანყებას აპირებდით და თავმდაბლად ითხოვეთ\n\nშეწყნარება, თორემ დიდ სატანჯველს მოგაყენებთო. ქართველები არც\nგატყდნენ და არც შებრალება სთხოვეს. მაშინ ნოინმა უბრძანა თავის\nმხლებლებს: გააკავეთ ეს ქართველები, დაატიტვლეთ, ყველას თოკებით\nშეუკარით მკლავები, წაუსვით ტანზე თაფლი, დასხით პაპანაქება მზეზე\nდა იხრაკებოდნენ, ვიდრე არ გამოტყდებიან და შეწყნარებას არ\nმოითხოვენო. ეს ბრძანება იმწამსვე შეასრულეს. აუარებელი მწერი\nდაეხვია მათ ტანზე და სტანჯავდა. მტერს ეგონა, ქართველები მალე\nშეუშინდებიან წვალებას, თავისავე პირით აღიარებენ თავის ბრალსა და\nხვეწნას დამიწყებენო; მაგრამ ამაოდ. გავიდა მრავალი დღე და\nქართველთა სიმტკიცე იოტის ოდენადაც არ შერყეულა. ვერც მუქარამ და\nვერც მომსყიდველმა დაპირებამ მათ ვერ ათქმევინა ის, რაც უნდოდათ\nმწვალებლებს.\n4. თავდადება ცოტნესი\nამასობაში დადგა ის დრო, როდესაც პირობისამებრ უნდა შეყრილიყვნენ\nსაქართველოს მთავარნი თავიანთი ჯარებით ახალციხის ახლოს; აქ\nდანიშნულ ვადაზე ცოტნე დადიანი გამოცხადდა თავისი ჯარით, მაგრამ\nნაცვლად თავმოყრილი ქართველი ლაშქრისა, მას დახვდა საზარელი\nამბავი. მან იმწამსვე მიიღო იმისთანა მაღალი და საკვირველი\nგარდაწყვეტილება, რომელიც შეეფერება სამაგალითო მამულიშვილს და\nყოვლად ღირსეულ ვაჟკაცს. თავისი ლაშქარი მთლად უკანვე აფხაზეთში\nდააბრუნა, თვითონ კი გასწია ანისისაკენ ორი მოსამსახურით იმ\nგანზრახვით, რომ მისულიყო დატყვევებულ ქართველებთან და ჭირსა\nდა ტანჯვაში მათთან ყოფილიყო.ცოტნემ გაიარა მესხეთი ანუ\nახლანდელი ახალციხის მხარე, შემდეგ ჯავახეთი, ჩავიდა სომხეთს და\nშევიდა სომეხთა დედაქალაქ ანისში. ერთ დიდ მოედანზე დაინახა\nქართველი ტყვეები, რომელნიც გატიტვლებულნი და მკლავებ-\nშეკრულნი ისხდნენ მზის გულზე და იხრაკებოდნენ. საშინელმა\nწუხილმა შეიპყრო გმირული გული ცოტნესი, როცა ამისთანა\nდამამცირებელ მდგომარეობაში ნახა წარჩინებული ქართველნი. მაგრამ\nამასთან ნუგეშიც იგრძნო, რადგან დაინახა, თუ რა ღირსეული\n\nვაჟკაცობით იტანდნენ ამ სათაკილო სასჯელს მისი მეგობარნი.ცოტნე\nგადმოხტა ცხენიდან, მივიდა თავის მეგობრებთან და მხურვალედ\nმიესალმა; მერე ფიცხლავ გაიძრო თავისი ტანისამოსი, გატიტვლდა,\nთვითონვე შეიკრა თოკებით მკლავები და ჩაჯდა ამ სახით თავის\nმეგობრებს შორის დაღონებული. როცა ეს ამბავი ნოინს მოახსენეს, იგი\nსაშინლად გაოცდა, დაიბარა თავისთან ცოტნე და ჰკითხა მიზეზი, რად\nმოვიდა აქ და რად ჩაჯდა გატიტვლებულ ქართველთა შორის. ცოტნემ\nმიუგო: მე მოვედი იმიტომ, რომ ჩემი ამხანაგები უდანაშაულონი არიან.\nუდანაშაულოთა დასჯა კი თუ შეიძლება, მეც მათთან ერთად\nდამსაჯეთო.ამ სამაგალითო სათნოებამ და იშვიათმა მეგობრულმა\nერთგულებამ ისეთი ძლიერი შთაბეჭდილება მოახდინა ნოინზე, რომ მან\nთქვა: რადგანაც ქართველნი იმდენად სათნონი და კეთილნი ყოფილან,\nიმდენად ერთგულნი ერთმანეთისა, რომ შორეული აფხაზეთით მოვიდა\nეს დიდებული კაცი, რათა თავი დასდოს მეგობრებისათვის, ამიტომ\nვენდობი მეც მათ და ვანთავისუფლებ ყველასო.ასე იხსნა სახელოვანმა\nმამულიშვილმა ცოტნე დადიანმა რჩეული ქართველები საშინელი\nწამებისაგან.\nტყვეობიდან დაბრუნებულნი ქართველნი შეუდგნენ ქვეყნის\nგაძლიერებას, დაამყარეს ამერთა და იმერთა შორის ძმური კავშირი და\nერთობა, და განდევნეს თავისი ქვეყნიდან მონგოლნი.", "pages": "4–7"}, {"title": "იავნანამ რა ჰქმნა?", "text": "სამშობლო ღვინისა\nთბილისიდან რომ აღმოსავლეთისკენ წახვიდე, ერთი დღის\nმოგზაურობის შემდეგ მიადგები ერთ გრძელ მთას, რომელსაც ჰქვია\nცივი. ამ ცივის მთაზე რომ ახვიდე და იქით, აღმოსავლეთისაკენ\nგადაიხედო, შენ თვალწინ, ქვემოთ გადაიჭიმება ვეებერთელა ვაკე,\nრომელსაც ჰფარავს მთელი მწვანე ზღვა ვენახებისა და ზვრებისა. ამ\n\nვაკის ზედ შუა წელზე დაინახავ გრძელ ლაპლაპა ზოლს,\nჩრდილოეთიდან სამხრეთისაკენ გავლებულს. ეს სწორი ვაკე არის\nკახეთის ველი, ლაპლაპა ზოლი კი მდინარე ალაზანი, რომელიც კახეთს\nჰყოფს ორ — თითქმის თანასწორ ნაწილად; აქეთა ნახევარს ჰქვია\nგამოღმა მხარი,იქითას — გაღმა მხარი. გაღმა მხარს საზღვრად უძევს\nაღმოსავლეთით დიდი და მაღალი მთები და ესენი ჰყოფენ კახეთს\nდაღესტნისაგან, რომელიც იწყება ამ მთებს იქით.\nთუ გაღმა მხრისაკენ თვალს დააკვირვებ, ერთ ადგილას მთის ძირში\nგაარჩევ დიდ ღელეს, ღრმად შევარდნილს მთაში. ეს ღელე ახლა სახნავ-\nსათესი ადგილია, მაგრამ რომ ახლო მიხვიდე და კარგად გასინჯო,\nმიწების მიჯნებზე და განაპირას ადვილად შეამჩნევ ქვიტკირის ნაშთებს.\nეს ნაშთები უტყუარი ნიშანია იმისი, რომ ეს ადგილი ნასოფლარია.\nსოფელი ვაშლოვანი\nდიახ, ძველ დროში სწორედ ამ ადგილას ჰყვაოდა კარგა მოზრდილი\nსოფელი, რომელსაც ვაშლოვანი ერქვა. დასავლეთით ამ სოფელს ერტყა\nზვრები და ვენახები, ხოლო აღმოსავლეთის მხრივ ის თითქმის ეხებოდა\nხშირსა და აყრილ ტყეს, რომლითაც შეფენილი იყო მთა. ამ ხშირი ტყის\nწყალობით შიგ შუაგულს სოფელში მიწიდან შადრევანივით\nამოჩუხჩუხებდა ვეებერთელა ანკარა წყარო, რომლის ყინულივით ცივი\nწყალი იყო საყვარელი სასმელი მთელი სოფლისა.შენობანი სოფლისა\nსულ ქვიტკირისანი იყვნენ და მოწმობდნენ, რომ სოფელი შეძლებული\nიყო. მართლაც, მაშინ ვაშლოვანმა და მთელმა კახეთმა არ იცოდა, რა იყო\nვაჭრის ვალი, რომელშიაც ახლა კახეთი ჩაფლულია.ვაშლოვანის ნაპირას,\nაღმოსავლეთით, ტყის ახლოს იდგა მშვენიერი ორსართულიანი სასახლე,\nირგვლივ შემკული ლამაზი მოაჯირებით. ეს სასახლე ეკუთვნოდა თავად\nზურაბ ქართველაძეს, რომელიც განთქმული იყო მთელს კახეთში თავისი\nსიმდიდრითა და პურადობით. ცოლად მას ჰყავდა ქართლიდან\nმოყვანილი ქალი მაგდანი. აგებულობით სუსტი, მაგდანი იყო სწორედ\nოქროს გულის პატრონი. მათ სახლში ყოველდღე იმდენი საჭმელი\n\nკეთდებოდა, რომ ორ-სამ სახლობას ეყოფოდა, მაგრამ ხშირად\nდააკლდებოდა ხოლმე საჭმელი და გაუმაძღარნი რჩებოდნენ. ამის\nმიზეზი იყო მეტად კაცთმოყვარე გული მაგდანისა. ის უხვად უგზავნიდა\nთავის სახლიდან სანოვაგეს ყოველ ავადმყოფს, ღარიბსა და\nგაჭირვებულს. ამასთან მაგდანს ჰქონდა საოცარი ხმა და განთქმული იყო\nმთელს იმ მხარეში თავისი მშვენიერი სიმღერით.მისი ხმა და სიმღერა\nისე ღრმად მიდიოდა კაცის გულში, ისეთი სიამოვნების ჟრუანტელს\nჰგვრიდა, რომ ვინც კი მას მოისმენდა, თავის სიცოცხლეში აღარ\nდაავიწყდებოდა. ზურაბმაც მშვენივრად იცოდა თარზე დაკვრა. როცა\nქმარი უკრავდა თარზე და ცოლი დამღეროდა, ყური ამაზე უკეთესს\nვერას გაიგონებდა.ზურაბი და მაგდანი სულ ხუთი-ექვსი წლის\nჯვარდაწერილნი იყვნენ. შვილად ჰყავდათ ერთადერთი ქალი — ქეთო,\nრომელიც მესამე წელიწადში იდგა. მეტად საყვარელი ბავშვი იყო ქეთო:\nლამაზი, თეთრი ბამბის ქულასავით, ცქრიალა, მხიარული, დაუღალავი\nმოტიკტიკე. ამასთან ქეთოს უყვარდა თავისი დედის სიმღერა, ხშირადაც\nამღერებდა და სულგანაბული ყურს უგდებდა მთელი საათობით. კაცს\nსწორედ ჩასაყლაპავად მოუნდებოდა ეს ბავშვი. დედ-მამას მასზე\nამოსდიოდა მზე და გაგიჟებით უყვარდათ.\nლეკები კახეთში\nვაშლოვანში და საზოგადოდ კახეთში მაშინდელ დროში ხშირად\nდაიარებოდნენ ლეკები. ძველი დროიდან დაღესტანსა და საქართველოს\nშორის ტკბილი განწყობილება არსებობდა, — დიდი მეგობრობა\nსუფევდა. ყოველ საქართველოს მტერს დაღესტანი მტრობას უწევდა,\nყოველ საქართველოს მეგობარს მოყვრულად ეპყრობოდა. არავის არ\nახსოვდა, რომ ლეკები როდისმე საქართველოს დასცემოდნენ და ჩხუბი\nაეტეხნათ ქართველებისათვის. ლეკები მტრად გაუხდნენ ქართველებს\nშემდეგში, როდესაც მაჰმადიანობა მიიღეს და როდესაც საქართველომ\nმართლმადიდებელი რუსეთისაკენ გაიწია. ძველ დროში კი დიდის\nპატივისცემისა და გულითადი მეგობრობის მეტი ქართველებს არა\nმოაგონდებოდათ რა. ამ მეგობრული მეზობლობის გამო ლეკები\n\nთავისუფლად მიდი- მოდიოდნენ კახეთში, უმეტეს წილად სავაჭროდ.\nგასასყიდად გამოჰქონდათ უფრო ნაბდეულობა და იარაღეულობა,\nრომლის კეთებაშიც განთქმულნი იყვნენ.\nქეთოს იტაცებენ\nსოფელ ვაშლოვანში დაიარებოდა კაი ხნიდან სავაჭროდ ორი ბაჯაჯგუნა\nლეკი. ესენი ისე წყალწაღებულები იყვნენ, რომ თვითონ ლეკებსაც\nაბუჩად ჰყავდათ აგდებული. ამიტომ მათგან ცუდი საქმის\nგაბედვასარავინ არ მოელოდა, მაგრამ მალე მათ გაამართლეს ქართული\nანდაზა: თავჩაღუნული კუდგაბზეკილიაო...\nერთხელ ერთმა ამ ლეკთაგანმა თავის ამხანაგს უთხრა:\n— იცი, რა აზრი მომივიდა! რამდენი ხანია, რაც ჩვენ სავაჭროდ\nდავიარებით, მაგრამ რა გამოვიდა? ისევ ისეთი ღატაკები ვართ,\nროგორიც ვიყავით, ისევ ისეთივე ძაღლური ცხოვრება გვაქვს, როგორიცა\nგვქონდა. სხვაფრივ კი რომ მოვიქცეთ, ერთბაშად გავმდიდრდებით და\nმოვრჩებით ამდენ ვაი-ვაგლახსა და ლაწლაწს.\n— როგორ? — ჰკითხა ამხანაგმა.\n— ზურაბ ქართველაძე ხომ ძლიერ მდიდარია? — ჰკითხა მან.\n— ჰო, მდიდარია, მაგრამ რას გვარგებს ჩვენ იმის\n\nსიმდიდრე? — უპასუხა იმან.\n— გვარგებს, თუ ჭკუით მოვიქცევით. ამ მდიდარ კაცს ხომ გაგიჟებით\nუყვარს თავისი ერთადერთი ქალი?\n— უყვარს, მაგრამ რა გამოვიდა მანდედან?\n— ის გამოვიდა, რომ თუ ჩვენ იმ ბავშვს როგორმე მოვიტაცებთ და ტყვედ\nწავიყვანთ დაღესტანში, როგორ გგონია, ქართველაძე განა თავის\nშეძლებას დაიშურებს, რომ ტყვეობიდან დაიხსნას შვილი? ჰაი, ჰაი, რომ\nარ დაიშურებს.\nამხანაგსაც მოეწონა ეს აზრი და გადასწყვიტეს, რომ თვალი ადევნონ და\nრა წამს იგდონ ხელში მოხერხებული დრო, მოსტაცონ ჩუმად\nქართველაძეს ქეთო და ტყვედ წაიყვანონ დაღესტანში.ჩვენ უკვე ვიცით,\nრომ სოფელ ვაშლოვანს აღმოსავლეთით ეკრა დიდი ატეხილი ტყე. ამ\nტყის პირას ხშირად სეირნობდა ხოლმე ქართველაძის სახლობა,\nრადგანაც სახლი იქვე ახლო ედგათ. ერთხელ, ქეთოს გამდელმა, საღამო\nჟამს ამ ტყისკენ გამოისეირნა და თან ჰყავდა პატარა ქეთოც. ტყეს რომ\nმიუახლოვდნენ, ბავშვმა ხის ქვეშ ჩიტი დაინახა და გაექანა; ჩიტმა ისკუპა\nდა იქით ხეებში გადაფრთხიალდა. ბავშვიც უკან დაედევნა. ამასობაში\nქეთო კარგა შორს წავიდა ტყეში. გამდელიც უკან მისდევდა. უცებ\nსაიდგანღაც გაჩნდა ლეკი, მივარდა ქეთოს, სტაცა ხელი, მეორე ხელი\nპირზე დააფარა და გაიტაცა. გამდელმა დაყვირება ვერ მოასწრო, რადგან\nამ დროს მეორე ლეკმა თავში კეტი დაარტყა და უსულდგმულოდ დასცა\nმიწაზე. გაიტაცეს ქეთო და წაიყვანეს.\nმდევარი ქეთოს დედ-მამას ფიქრი არაფრისა ჰქონდათ.ეგონათ,\nმეზობლებში იქნებიან ჩვენი ქალი და გამდელი და თავის დროზე\nმოვლენო. როდესაც დაღამდა და გამდელი ბავშვით არსად იყო,\nშეფიქრიანდნენ და მეზობლებში გაგზავნეს მოსაკითხად: მაგრამ აბა რას\nიპოვნიდნენ. ყველგან უთხრეს, რომ დღეს არც კი გვინახავს ისინიო.\nმაშინ შეშინებულმა დედ-მამამ ჩირაღდნებით დაუწყო ძებნა სოფლის\n\nგარშემო. დიდხანს ეძებეს და ბოლოს თავს წაადგნენ ტყეში გამდელს,\nრომელიც მკვდარივით ეგდო ხის ძირას. ღამის სიგრილემ და ხმაურობამ\nგონში ჩააგდო გამდელი და გამოაცოცხლა. ჯერ ხეირიანად არ\nგამორკვეულიყო, რომ შეშფოთებულმა და გაფითრებულმა მაგდანმა\nმიაძახა: — “ქეთო სადღა არის?” გამდელმა სუსტი ხმით და შესვენებით\nუამბო, როგორ მოიტაცეს ლეკებმა ქეთო. ამის გაგონება და მაგდანის\nგულის წასვლა ერთი იყო. ზურაბსაც საშინელი თავზარი დაეცა, მაგრამ\nვაჟკაცურად თავი შეიმაგრა, მწუხარებას\n\n\nსძლია და დაიძახა: — არიქა მდევარიო!\nმაშინდელ დროში ყველა ვაჟკაცს სრული თოფ-იარაღი ჰქონდა სახლში\nდა გამოცდილი მეომარი იყო, რადგანაც გაჭირვების დროს საქართველოს\nმეფე ქუდზე კაცს დაიბარებდა ხოლმე, ამიტომ ზურაბის დაძახების\nშემდეგ ერთი საათი არ გასულიყო, რომ მისი სახლის წინ იდგა ოცამდის\nვაჟკაცი, თავით ფეხებამდის შეირაღებული... სწრაფად გამოვიდა\nიარაღშივე ჩამჯდარი ზურაბი, მიესალმა და გაუძღვა წინ.\nღამე ღრუბლიანი და ძლიერ ბნელი იყო. მას უკან, რაც ლეკებმა ქეთო\nგაიტაცეს, კარგა ხანმა განვლო. დაღესტნისაკენ ტყეებსა და მთებში\nმისდევდა მხოლოდ ვიწრო ბილიკები და მთაზე სიარული ბნელ ღამეში\nძლიერ ძნელი იყო ხამი კაცისათვის.ქეთოს მომტაცებელმა ლეკებმა ისე\nიცოდნენ ეს ბილიკები, რომ თვალდახუჭულსაც შეეძლოთ მათზე\nსიარული. ზურაბსა და იმის რაზმს კი აქეთ თითქმის არ ევლოთ. ამიტომ\nლეკებმა მთელი ღამე განუწყვეტლივ და დაუბრკოლებლივ იარეს, დიდს\nმანძილზე გაუსწრეს მდევარს, და მოტაცებული ქეთო მეორე დღესვე\nგადაიყვანეს დაღესტანში. ზურაბ ქართველაძე თავისი ამალით\nიძულებული შეიქმნა ხელცარიელი და საშინლად დაღონებული უკანვე\nდაბრუნებულიყო.\nქეთოს ნაიბი ყიდულობს\nლეკებმა პირველად ქეთო გაატარეს ერთ დიდს დაღესტნის სოფელზე,\n\nრომელიც იდო აქეთ ნაპირას, კახეთის საზღვრის ახლო. ამ სოფელში\nცხოვრობდა ერთი მდიდარი ნაიბი, რომელსაც ემორჩილებოდა მთელი\nდასავლეთის მხარე დაღესტნისა. მას ჰყავდა ცოლად ლეკისავე ქალი,\nშემკული ერთსა და იმავე დროს ვაჟკაცურის გამბედაობით და მეტად\nნაზი გულით. ესენი იყვნენ დიდი ხნის ნაქორწილარი, მაგრამ შვილი კი\nარა ჰყავდათ და გადაწყვეტილი ჰქონდათ,ვისიმე შვილი\nეშვილათ.საღამოს ჟამი იყო, როცა იმათ სახლის წინ ლეკებმა ქეთო\nგაატარეს. ნაიბი და იმისი ცოლი კარაპანში ისხდნენ. მათ დაინახეს\nმიმავალი ორი ლეკი და ერთ მათგანს შეამჩნიეს ზურგზე გუდა,\nრომლიდანაც ბავშვის თავი და სახე ჩანდა. დაუძახეს თავისთან. ლეკები\nმოწიწებით მივიდნენ და თავი დაბლა დაუკრეს, როგორც თავის ბატონს,\nმბრძანებელს. ლეკებს ამბავი დაწვრილებით გამოჰკითხეს. ამათ\nდატუქსვისა ეშინოდათ და ამიტომ მართალი დაუმალეს. — უთხრეს,\nრომ ეს ბავშვი გზაზე ტყეში ვიპოვნეთ და წამოვიყვანეთო.\nპატარა ქეთო ცალკე დიდი ხნის მგზავრობისაგან და ცალკე\nშიმშილისაგან ძლიერ მისუსტებული იყო და ძლივსღა ახელდა თვალებს.\nმაგრამ ეს სისუსტე კიდევ უფრო საყვარელ ბავშვად ხდიდა მას. რაწამს\nნაიბმა და მისმა ცოლმა ეს ბავშვი დაინახეს, მაშინვე გული ზედ\nშეუვარდათ. ნაიბის ცოლმა ჰკითხა ლეკებს: — რა მოგცეთ, რომ ეს ბავშვი\nჩვენ დაგვითმოთო? — რა უნდა გვიბოძო, ქალბატონო, თუ გნებავთ,\nფეშქაში გახლდეთო. ნაიბი ადგა, შევიდა სახლში, გამოუტანა\nვეებერთელა ქისა, ოქროებით სავსე, და მისცა ლეკებსა. ქეთო გამოართვა\nლეკს ნაიბის ცოლმა და მაშინვე გულში ჩაიკონა. ლეკებმა მადლობა\nგადაუხადეს და წავიდნენ.\nდედობრივმა ალერსმა მალე მოასულიერა მიბნედილი ბავშვი. მას თუმცა\nყველაფერი ეუცხოვა, მაგრამ, იმოდენა წვალების შემდეგ ბრიყვი\nლეკების ხელში, ნაიბის ცოლის მისაყვარლება და ზრუნვა სწორედ\nშვებად ეჩვენა. პირველ ხანებში მაინც ქეთო ყველაფერზე გულცივად იყო\nდა ხშირად ტიროდა, თავის დედ-მამას, სხვა შინაურებს და თავის\nსოფელს მოიგონებდა. მაგრამ ნაიბის ცოლი და იმისი ქმარი ისეთი\n\nსიყვარულით, მოფერებითა და ალერსით ექცეოდნენ ქეთოს, რომ მალე\nდაავიწყებინეს წინანდელი ყველაფერი.\nქეთო ლეკ-ქალად იქცევა\nბავშვი აწმდგომით ცხოვრობს, ის შეუწყვეტლივ ყოველდღე იზრდება,\nსულითა და ხორცით წინ მიდის, მატულობს, გრძნობს ამ თავის ზრდას,\nწინსვლას და ბედნიერია ამ გრძნობით. ის სრული სიხარულით შეჰხარის\nცასა და დედამიწას, ბუნებას და ადამიანს. რადგან ბედნიერია\nაწმდგომით, ბავშვი არ ფიქრობს არც წარსულზე და არც მომავალზე. ამის\nგამო წარსულის ნაშთი, ხსოვნა, მოგონება მის გულსა და გონებაში მალე\nსუსტდება, მკრთალდება და, თითქო სრულიად იშლება, აწმდგომი კი\nსრული ძალით მოქმედებს მასზე და იჭერს წარსულის ადგილს მთლად,\nგანუყოფელად.ქეთოსაც ეს დაემართა. ნაიბმა და იმისმა ცოლმა ისე\nშეაყვარეს ქეთოს თავი, რომ თანდათან ჩააქრეს მის სახსოვარში ღვიძლი\nდედ-მამის სიყვარული, მოგონება, სახე. ორი-სამი წლის შემდეგ ქეთოს\nთავის ნამდვილ მშობლად მიაჩნდა ნაიბი და მისი ცოლი: იმათით\nცოცხლობდა, იმათით ჰხარობდა. ღვიძლი დედ-მამის კვალი, თითქო\nმთლად წაიშალა მის ბუნებაში. ლეკურმა ენამ ცოტ-ცოტაობით, დღითი\nდღე შეასუსტა ქართული ენა ქეთოში, დაიჭირა მისი ადგილი და ჩააქრო\nიგი. ლეკურმა სოფელმა ვაშლოვანის სახსენებელი ამოაგდო მისი\nგულიდან. ქეთო დიდხანს ჰგრძნობდა მხოლოდ ერთს დანაკლისს:\nმაგდანის მშვენიერი ხმა, დამატკბობელი სიმღერა ქეთოს ყურს აღარ\nასიამოვნებდა. მაგრამ ესეც დაივიწყა, თუმცა ყველაზე გვიან. ერთი\nსიტყვით, აწმდგომი გამეფდა ქეთოს სულში და წარსული ჯერ მკრთალი\nგახდა და მერე სრულიად გააქრო. ქართველი ქალი გადაიქცა ლეკ-\nქალად, კახეთის შვილი — დაღესტნის შვილად.ამ სრულ გალეკებას\nქეთოსას იმანაც მოუწყო ხელი, რომ ნაიბმა სასტიკი ბრძანება გასცა\nსოფელში: — არამც და არამც არავინ არ გაბედოს და ქეთოს ყურს არ\nგააგონოს, რომ ნაშვილარია და არა ჩვენი ღვიძლი შვილიო.\nამაო ცდა ქეთოს მამისა\n\nრას ფიქრობდა და რას სჩადიოდა იმ დროს ქეთოს დედ- მამა? დიდხანს\nმათ არ იცოდნენ, რა უყვეს ლეკებმა ბავშვს. ზურაბს თავისი ქალი უფრო\nშუა დაღესტანში ეგულებოდა და იქ აძებნინებდა, რადგანაც მომტაცი\nლეკები იქიდან იყვნენ. ამასობაში გავიდა სამი, ოთხი წელიწადი. ბოლოს\nერთმა ნაცნობმა ლეკმა მოუტანა ამბავი, რომ ამა და ამ ნაიბს შენი ქალი\nხელში ჩაუგდია, უშვილებია და ზრდის, როგორც საკუთარ ქალსაო.\nზურაბმა შეუთვალა ნაიბს, რომ ეგ ქალი ჩემი შვილია, მოტაცებულია\nჩუმად და ოღონდ დამიბრუნე უკან და რასაც მთხოვ, მომცემი\nვარო.ნაიბმა შემოუთვალა პასუხად, რომ თუ თავდაპირველად\nმცოდნოდა, რომ ეს ბავშვი შენი ქალია, მე თვითონ დაგიბრუნებდი,\nმაგრამ ახლა გვიანღა არისო. მეც და ჩემ ცოლსაც მზე ამ ბავშვზე\nამოგვდის, მასაც ძლიერ ვუყვარვართ, აქაურობაში გაჩვეულია. თქვენ\nსრულიად დავიწყებული ჰყავხართ და ამიტომ ქეთოს ვერ დაგიბრუნებ,\nთუნდ მთელი კახეთის სიმდიდრე კარებზე დამიგროვოო.ამისთანა\nპასუხის შემდეგ ზურაბს შეეძლო თავისი ქალი დაეხსნა ძალით ან რაიმე\nხერხით. დარჩენა კი ქეთოსი დაღესტანში აუტანელი იყო მისი დედ-\nმამისათვის, მით უმეტეს, რომ მაგდანს ქეთოს შემდეგ შვილი აღარ\nეძლეოდა. ქართველაძე ბევრჯერ გაემგზავრა დაღესტნისაკენ ოციოდე\nშეიარაღებული ვაჟკაცით ქეთოს მოსატაცებლად, მაგრამ ტყუილად.\nნაიბმა კარგად იცოდა წადილი და მეცადინეობა მისი და ამიტომ\nყოველთვის გზაში დაახვედრებდა ხოლმე ჩასაფრებულ ლეკებს იმისთანა\nადგილას, სადაც ერთი ჩასაფრებული ოცსა და ორმოც ვაჟკაცს გზას\nშეუკრავდა. სიმრავლეც ქართველების რაზმისა აძნელებდა შეუმჩნევლად\nმიახლოვებას ნაიბის სოფლამდის.როცა ამ გზით ვერაფერს გახდა,\nზურაბმა ხერხს მიმართა: ხმა გააგდო, რომ გულიდან ამოვიღე ჩემი ქალი\nდა აღარ მწადია მოვტაცო დედობილსა და მამობილსაო. ეს ხმა მივიდა\nნაიბამდისაც და მან ჯერ თუმცა ეჭვის თვალით შეხედა, მაგრამ მერე კი\nდაიჯერა, რადგან მთელი ორი წლის განმავლობაში ქართველაძის მხრივ\nჩამი-ჩუმიც არ ისმოდა. აქამდის ქეთოს დიდი სიფრთხილით უშვებდნენ\nკარში, ახლა კი, მაშინდელი დროის ლეკების სხვა ქალებივით,\n\nთავისუფლად დადიოდა ერთი უბნიდან მეორე უბანში თავის\nნაცნობებთან. ეს ყველაფერი ზურაბმა კარგად შეიტყო ნაცნობი ლეკების\nშუამავლობით და თადარიგს სხვანაირად შეუდგა.\nქეთოს მამა იტაცებს\nდადგა სწორედ მეათე გაზაფხული მას უკან, რაც ქეთო მოიტაცეს\nლეკებმა. ტყე ხშირად იყო შეფოთლილი და აადვილებდა შეუმჩნევლად\nმისვლას ნაიბის სოფლამდის. ზურაბმა მოიხმო ერთი იქაური ლეკი,\nდიდი ხნის ნაცნობარი და პურმარილით დავალებული. გაიმძღვარა წინ\nდა თან წაიყვანა მხოლოდ ათი შეირაღებული ვაჟკაცი. მთელი მანძილი\nისე ფრთხილად გაიარეს, რომ ერთი ლეკი არ დახვედრიათ გზაზე.მეორე\nდღეს საღამოს ჟამს მივიდნენ ნაიბის სოფლის პირად და ტყეში\nმოხერხებულ ადგილას დაბინავდნენ. ლეკი ჩუმად წავიდა იმ ღამეს\nთავის სოფელში, გაიგო და დილასისხამზე მეტად საამო ამბავი მოუტანა.\nქეთო თურმე ყოველ დილით აივლიდა ხოლმე ერთი თავისი მეგობარი\nქალის სანახავად. ეს ქალი იყო შვილი წინანდელი მოხუცებული ნაიბისა,\nრომელიც ამას წინათ გადაცვლილიყო. ყმაწვილი ქალი ძლიერ მწუხარე\nიყო მამაზე და ამიტომ ქეთო ყოველდღე დადიოდა იმის\nსანუგეშებლად.ამოვიდა თუ არა მზე, ზურაბ ქართველაძე მივიდა გზის\nპირად, ამოეფარა ხეების ჯგუფს და დაიწყო ცქერა იქითკენ, საიდანაც\nქეთოს უნდა გამოევლო. ქართველაძის პირდაპირ გზის იქით ამართული\nიყო დიდი სერი, რომელიც იმ სოფელს ჰყოფდა ორად, ქვემო და ზემო\nუბნად. ქეთოს ქვემო უბნიდან უნდა ამოევლო ამ სერსა და ტყეს შუა და\nასულიყო ზემო უბანში. ლოდინში კარგა ხანმა გაიარა, ასე რომ ზურაბმა\nიფიქრა, ვაი თუ ქეთო სულაც არ ფიქრობდეს ზემო უბანში ავლასაო.\nმაგრამ, აგერ, შორს გამოჩნდა ქალი, ახლად შეღერებული, თამამად\nმომავალი და ლეკურად ჩაცმული. ზურაბი თვალებად გადაიქცა და\nგულის ცემამ მოუმატა. ქალი თანდათან მოუახლოვდა და ზურაბი ისე\nშეაცქერდა, თითქო თავისი მშიერი თვალით მისი შეჭმა უნდოდა. ქეთოს\nცოტა იერი შესცვლოდა, გაზრდილიყო ბევრად დიდი თავის ხანზე,\nმაგრამ ფერი და პირსახე სულ პატარაობისავე, უწინდებური შერჩენოდა.\n\nმამის გული უზომო სიხარულით აივსო, როცა თავისი ქეთო ისევ\nქართველ ქალად იცნო. ქეთომ მიატანა იმ ხეებს, რომელთაც ზურაბი\nამოჰფარებოდა, ამან იდროვა და წინ გადაუდგა ფრთხილად, რომ არ\nშეეშინებინა. ქეთო შეკრთა, დაფრთხა და შველივით განზე გახტა.\n— ნუ გეშინიან, შვილო, შენი მამა ვარ, მოვედი აქა, რომ დედასთან\nწაგიყვანო, შინა, — უთხრა ზურაბმა ტკბილი მამობრივი ხმით. ქეთო\nშიშით ისმენდა უცნაურს სიტყვებსა და ვერ გაეგო, რა უნდოდა მისგან ამ\nუცხო კაცს. ზურაბმა იფიქრა, თუ ლაპარაკში დრო დავკარგე, ვინმე\nმოგვასწრებს და საქმე წახდებაო; ამიტომ სწრაფად მივიდა ქეთოსთან,\nფრთხილად დაავლო ხელი და გაიტაცა ტყისკენ. ქეთომ შექმნა საშინელი\nწივილ-კივილი. სოფელში გაიგონეს ეს წივილ-კივილი, მაგრამ ვისი იყო\nან საიდან მოდიოდა, პირველ ხანებში ვერ შეიტყვეს. სოფელი\nშეჩოჩქოლდა და რამდენიმე კაცი წავიდა ნაიბთან. ის სხვაგან იყო და\nამიტომ დროზე ვერ შეატყობინეს. როცა უთხრეს ეს ამბავი, საშინლად\nშეწუხდა და თქვა: უთუოდ ქალი მომტაცა ქართველაძემაო. და მდევარი\nდაიბარა. ფიცხლავ შეიკრიბა ოცდაათი შეიარაღებული ვაჟკაცი.\nვაშლოვანისაკენ სამი გზა მიდიოდა. მდევარნი ნაიბმა სამად გაჰყო. ათი\nვაჟკაცი გაგზავნა ერთს გზაზე, ათი მეორეზე და ათიც თვითონ გაიდევნა\nმესამე გზაზე. სამივე რიგმა მდევარმა თითქმის ვაშლოვანამდე უწია,\nმაგრამ ზურაბისა და ქეთოს კვალს ვერ მიაგნეს; ისინი, თითქოს მიწაში\nჩაძვრნენ და გაჰქრნენ. საქმე ის იყო, რომ ზურაბმა თავისი ქალი\nვაშლოვანისაკენ როდი წამოიყვანა, რადგანაც იცოდა კარგად, რომ\nმდევარი აქეთკენ დაედევნებოდა. ის დაადგა ჩრდილოეთის გზას,\nრომელიც კახეთის ზემო სოფლებისაკენ მიდიოდა, შორს მოვლა არჩია,\nრომ შინ მშვიდობით მისულიყო, მაგრამ ვაი ამ მშვიდობას.\nქეთო საშინლად იტანჯებოდა რომ პირველ ხანებში ქეთო ვერც იცნობდა\nთავის მამას და მწუხარე იქნებოდა, ამის ფიქრი ჰქონდა ზურაბს. ხოლო\nამასთან დარწმუნებული იყო, რომ ქეთო მალე მოვიდოდა გონს, იცნობდა\nჯერ თავის მამას, მერე დედას, თავის ბავშვობა მოაგონდებოდა და\nმოიმხიარულებდა, მაგრამ საშინლად მოტყუვდა. ქეთოს მწუხარებას\n\nმთელი მგზავრობის დროს საზღვარი არა ჰქონდა. მას განუწყვეტლივ\nღაპაღუპით სდიოდა ცრემლები თვალებიდან და ისე ოხრავდა, თითქოს\nლამობს გულ- ღვიძლი თან ამოატანოსო. მამა საშინლად იტანჯებოდა\nთავის ქალის ამისთანა მდგომარეობით; ცდილობდა,\nროგორმე გაექარვებინა მისი ნაღველი, მაგრამ ტყუილად. ყოველი მისი\nალერსი ქეთოს მწუხარებას უფრო უმატებდა. ის უყურებდა ზურაბს,\nროგორც თავის მოსისხლე მტერს, რომელმაც მოაშორა საყვარელ დედ-\nმამას, სანატრელ სამშობლოს და სადღაც მიჰყავს ტყვედ. ამიტომ ყოველი\nმისი ტკბილი სიტყვა და თანაგრძნობა ლახვარივით ესობოდა გულში.\nზურაბს ისღა ანუგეშებდა, რომ ეგება შინ მისვლამ მოიყვანოს ქეთო გონს,\nიცნოს დედა, თავისი კარ-მიდამო, სოფელი და ჩვენსკენ მოუბრუნდეს\nგულიო.\nამ აზრით იყო ზურაბი დაიმედებული, როცა თავის სახლის კარები\nშეაღო, შეიყვანა შიგ ქეთო და თავის ცოლს მხიარულად უთხრა: — “აი,\nმაგდან, მოგიყვანე შენი ქეთო!” — სიხარულისაგან გატაცებული მაგდანი\nგაექანა შვილისაკენ, მაგრამ სიმხიარულე სიმწუხარედ გადაექცა, როცა\nდააცქერდა თავისი შვილის სახეს, რომელზედაც\nგამოუთქმელი ტანჯვა იხატებოდა. მაგდანმა მხიარულად ჩაიკონა\nგულში ქეთო, უნდოდა გაექარვებინა მისი მწუხარება, მაგრამ ამაოდ.\nქეთო ყინულივით ცივად, ქვასავით უგრძნობლად იყო და არავითარი\nგავლენა არ იქონია მასზე მაგდანის მხურვალე დედობრივმა მიგებებამ\nდა ალერსმა. არა, იქონია, მაგრამ სრულიად წინააღმდეგი\nმოსალოდნელისა. მაგდანის ალერსმა ცოცხლად თვალწინ წარმოუდგინა\nქეთოს მისი დედობილის, ნაიბის ცოლის სახე და ალერსი. ვარამი უფრო\nკიდევ გაუძლიერდა და მდუღარე ცრემლის ნაკადული გადმოსკდა\nთვალებიდან.\n— შენი მშობელი დედა ვარ, შვილო! ესეც შენი ღვიძლი მამაა, —\nეუბნებოდა მაგდანი ქეთოს. —აი, სახლი, რომელშიაც შენ დაიბადე,\nდაცუცუნებდი პატარაობის დროს, აი, შენი პატარა აკვანი, რომელშიაც\nიწექი, აი, შენი საყვარელი ბაღჩა, რომელშიაც დილიდან საღამომდის\n\nიჯექი მაგრამ ქეთოს აქაურობისათვის არც თვალი ჰქონდა და არც ყური.\nმისი გრძნობა და გონება მთლად, განუწყვეტლივ, შეპყრობილი იყო\nუღრმესი დარდითა და ვარამით. მაგდანი მაინც იმედს არ ჰკარგავდა,\nრომ ქეთო დღეს თუ ხვალ მოიგონებდა თავის პატარაობას, იცნობდა\nმშობლებს და დაუბრუნდებოდა მათ.გავიდა რამდენიმე კვირა და ეს\nიმედი დედ-მამას არ აუსრულდა. ქეთო თითქმის არას სჭამდა, სმითაც\nცოტას სვამდა. ღრმად ოხრავდა, ხშირად ტიროდა და ღამითაც ძილი,\nმოსვენება არა ჰქონდა. ჩამოხმა, გაყვითლდა და მომაკვდავს დაემსგავსა.\nის იჯდა ტახტზე ჩუმად, უმეტეს ნაწილად თვალებდახუჭული, და მისი\nგონება ფრინავდა იქ, დაღესტანში, ნაიბთან და იმის ცოლთან, თავის\nტოლ-ამხანაგებთან და იქაურ სოფელთან. რაც გარშემო ერტყა, ყველა\nეუცხოვებოდა, ყველას ითვალწუნებდა, ყველა თავის მტრად მიაჩნდა,\nყველა ეჯავრებოდა, სძულდა. ბევრგვარი ხერხი იხმარეს, რომ\nმოეგონებინათ როგორმე პატარაობა. დედამ რამდენჯერმე მიიყვანა\nტყეში სწორედ იმ ადგილას, სადაც მოიტაცეს, მიიყვანა საღამოს იმ ჟამს,\nროდესაც მოიტაცეს. მიიყვანა წყაროს თავზე, სადაც ქეთო ხშირად იჯდა\nხოლმე თავის გამდელთან და უყურებდა, როცა სოფლის დედაკაცები\nკოკებს ავსებდნენ, იკიდებდნენ მხარზე და მიჰქონდათ. აჩვენა ყველა\nმეზობლის ქალები, ქეთოს ტოლები, რომლებთანაც ის პატარაობისას\nხშირად თამაშობდა, დაიბარა მისი გამდელი სხვა სოფლიდან, რომ ეგები\nის მაინც ეცნო. აჩვენა მისი დედოფლები, რომლებიც ყუთში მთლად\nშენახული ჰქონდა, რამდენჯერმე მიაქცია ქეთოს ყურადღება ეკლესიის\nზარის რეკვასა, რომელსაც პატარაობისას ქეთო ტაშის კვრას აყოლებდა,\nმაგრამ ვერც ერთმა ღონემ ვერ გასჭრა.დედ-მამამ ქეთოს შეუკერა ისეთი\nმშვენიერი ქართული ტანისამოსი, რომ ყველა ყმაწვილ ქალს თვალი ზედ\nდარჩებოდა, მაგრამ ქეთომ ახლოც არ მიიკარა და კიდევ უფრო\nშეუყვარდა ამის შემდეგ თავისი ლეკური ტანისამოსი...ბოლოს, ერთმა\nმეზობელმა უთხრა მაგდანს: — ქეთო შენ ძლიერ გგავს, სულ\nპირწავარდნილი დედაა. დადექ თქვენი დიდი სარკის წინ და დაიყენე\nგვერდით ქეთო. ის ჩაიხედავს სარკეში, შეადარებს ორ სახეს, თავისა და\n\nშენს სახეში დიდ მსგავსებას ნახავს და იქნება მაშინ გეშველოთო.\nმაგდანმა ესეც სცადა, მაგრამ ამან ქეთო უფრო გააოცა, როგორც\nუცნაურმა ქცევამ მაგდანისამ. სახეებს ხეირიანადაც არ შეხედა და\nმსგავსებას ხომ სრულიადაც ვერ შეამჩნევდა.ყმაწვილი ქალი დედ-მამას\nხელიდან ეცლებოდა, უავადმყოფოდ ჭკნებოდა, დნებოდა და\nსიკვდილამდე პატარა მანძილიღა ედო.\n— არა, მე ვეღარ ვუცქერ ამ ბავშვის ამდენ ტანჯვას და წვალებას: თუ\nრამდენისამე დღის განმავლობაში პირი ჩვენსკენ არ იბრუნა, შევსვამ\nცხენზე და ჩემის ხელით ავუყვან ნაიბსა და იმის ცოლს. ეტყობა,\nღირსეული ადამიანები ყოფილან, რომ აგრე შეუყვარებიათ თავი ჩვენი\nღვიძლი შვილისათვის, — უთხრა ზურაბმა თავის ცოლს მაგდანსა.ხოლო\nმაგდანი ესე ადვილად ვერ დასთმობდა ქეთოსა, და მზად იყო ისევ თავის\nახლო დაემარხა თავისი ერთადერთი შვილი, ვიდრე გაეგზავნა\nხელმეორედ და სამუდამოდ დაღესტანში.\nიავნანამ რა ჰქმნა?\nამასობაში გავიდა აპრილი და დადგა მშვენიერი მაისი.პირველსავე\nრიცხვში ზაფხულურად მოიღრუბლა და გაჩნდა ჭექა-ქუხილი.\nსაღამომდის იდინა ხშირმა და გამაცოცხლებელმა წვიმამ, საღამოზე კი\nისე მოიწმინდა ცა, რომ ერთი ნაფლეთი ღრუბელიც არსად იყო. კამარა\nმთლად ბრწყინვალე ვარსკვლავებით მოიჭედა. დატრიალდა მეტად\nშეზავებული ჰაერი, უთუოდ ეს იყო მიზეზი, რომ ქეთოს იმ ღამეს\nმშვიდობიანად ეძინა. მეორე დღეს ადგა ცოტა მოღონიერებული.\nშეუდარებელი დილა იყო: არემარეს კაშკაშა მზისაგან თავს დასდიოდა\nმთელი შადრევანი ბრწყინვალე სინათლისა და ამ სინათლეს\nმცენარეებზე ათასფრად აებრჭყვიალებინა დილის ნამი. ტყე სავსე იყო\nფრინველების გამაცოცხლებელი ჟივილ-ხივილით. ქართველაძიანთ\nბაღში ვარდის კოკრები საამურად გადაშლილიყო და გარშემო მოეფინა\nგულწარმტაცი სურნელება. ამ ვარდების მახლობლად ტკბილად\nდასძახოდა ბულბული, რომელიც იქვე ხეზე მოთავსებულიყო. ბუნება\n\nხარობდა, დღესასწაულობდა, თითქოს ათას ბედნიერს ქორწილს ერთად\nიხდისო.\nბუნება შეუდარებელი მკურნალია კაცის ვარამისა და დარდისა. შვება\nმისცა მან ქეთოს ნაღვლიან გულსაცა, და სახეზე მას აშკარად დაეტყო\nშემცირება იმ საშინელის მწუხარებისა, რომელიც აქამდის\nმაჯლაჯუნასავით აწვა ამის გულსა და გონებას და ნებას არ აძლევდა\nგარემოცულ ცხოვრებაზე დაფიქრებულიყო. ამასთან ქეთომ პირველად\nდაიწყო ფიქრი იმაზე, რისთვის და რად მიჩვენებენ ამდენ სიყვარულს\nუცხო ადამიანები და რადა სწუხან ჩემს მწუხარებაზედაო.დედამ\nადვილად შეამჩნია ქეთოს ეს სანუგეშო ცვლილება. იმედი მიეცა. ცალკე\nამ იმედმა და ცალკე მშვენიერმა დილამ კარგ გუნებაზე მოიყვანა მაგდანი\nდა მან, სრულიად უნებურად, თავისთვის დაიწყო ღიღინი იავნანისა. რაც\nქეთო დაჰკარგა, მას შემდეგ მაგდანის სიმღერის ხმა აღარავის გაუგონია.\nეს პირველი სიმღერა იყო ათი წლის დუმილის შემდეგ. მაგდანი\nფანჯარასთან იჯდა,ქეთო იყო მოთავსებული პატარა ტახტზე ოთახის\nკუთხეში. იავნანას მაგდანი ჯერ დაბალი ხმით, ღიღინით ამბობდა, მერე\nკი თავის ხმის სიმშვენიერემ გაიტაცა და თავისებურად დაამღერა, მაღლა\nაუწია. პატარა ხანს უკან, ისე, უნებლიეთ, გაიხედა ქეთოსკენ და გაოცდა.\nქეთოს აშკარად ეტყობოდა სახეზე აღელვება. ცხადი იყო, რომ რაღაცას\nიგონებდა და ვერ-კი მოეგონებინა გარკვევით. მის ბუნების სიღრმეში\nდიდი ხნის დამარხული ხსოვნა იღვიძებდა, მაგრამ ვერ-კი გამოეღვიძა.\nგონების ძირიდან რაღაც სანატრელი მოგონება აპირებდა ამოხეთქვას,\nმაგრამ ზევიდან კეც-კეცად აწვნენ სხვა წარმოდგენანი და უშლიდნენ\nმაღლა ამოსვლას. მაგდანმა ეს კარგად შეამჩნია და თავის ხმას მისცა\nსაოცარი მეტყველება და მიმზიდველობა. უწინ ამგვარი სიმღერით და\nამავე ხმით ყოველდღე უტკბობდა მაგდანი თავის ქეთოს სიპატარავის\nდღეებს. მაგდანის ხმამ უწია ქეთოს ბუნების სიღრმემდის, შესძრა ის\nძირიანად და გააცოცხლა იქ დამარხული ბავშვობის სანატრელი ნაშთნი,\nსაგონებელნი. მაგდანი თან ხმას აძლევდა მომხიბლავს ძალას და თან\nქეთოს შესცქეროდა უსაზღვრო დედობრივი სიყვარულით. ქეთოც\n\nთითქმის სჭამდა თვალით დედის პირისახესა და მღელვარებით\nცდილობდა ამ სახეზე ამოეკითხა რაღაც დიდი საიდუმლო და კიდეც\nამოიკითხა. ქეთოს აღელვებული სახე თანდათან დაწყნარდა,\nპირისახიდან მთლად გადაეყარა შავი ღრუბელი. განსაზღვრული სხივის\nნათელი მოეფინა სახეზე და სიხარულის სხივმა დაუწყო მასზე\nელვარება. უცებ წამოვარდა ქეთო ტახტიდან, დაიძახა სანატრელის ხმით:\n— “დედავ!” სწრაფლ მივარდა მაგდანთან, მოეხვია ორივე ხელით და\nმხურვალედ დაუწყო კოცნა. დედასა და შვილს თქრიალით მოსდიოდათ\nცრემლი, მაგრამ ეს ცრემლი იყო სიხარულისა, შვებისა, ლხენისა. პატარა\nხანს უკან ზურაბმაც შემოაღო კარები, ქეთო განთავისუფლდა დედის\nხვევნიდან, მიეგება შემოსულს, დაიძახა: — “მამა!” და მოეხვია.შემდეგ\nგაბრუნდა დედისაკენ, წაავლო ხელი, გაიყვანა მეორე ოთახში, დაიყენა\nთავის გვერდით დიდი სარკის წინ, სიყვარულით გადაავლო თვალი,\nმაგრამ რაღაცამ აზრი შეუშალა. სწრაფად მოშორდა სარკეს, შეირბინა\nმეორე ოთახში, გააღო ყუთი, ამოიღო თავის ახალი ქართული\nტანისამოსი და ლეკურის მაგივრად ჩაიცვა. შემდეგ ისევ მიიყვანა\nგაოცებული დედა სარკესთან, დაუდგა გვერდით, შეადარა სახეები,\nაშკარად დაინახა რამდენად ჰგავდა დედას, მიუბრუნდა მას, ჩამოეკიდა\nყელზე და ხელახლა დაუწყო კოცნა. უწინ ამისთანავე მოქმედებამ\nმაგდანისამ გააოცა, ახლა კი იგივე მოქმედება თვითონ ჩაიდინა. მერე\nდედას აახდევინა დედოფლების ყუთი და სიყვარულით მიუალერსა\nთავის უწინდელს მეგობრებს.\nერთმა მოგონებამ მეორე გამოიწვია, მეორემ მესამე, მესამემ მეოთხე, და\nქეთოს სარკესავით გადაეშალა თვალწინ თავისი სიპატარავის დრო.\nაქამდის ის დაჰყავდა დედას აქეთ-იქით ძალაუნებურად, ახლა კი\nთვითონ ქეთო მოსვენებას აღარ აძლევდა დედასა და მიჰყავდა ხან\nბაღჩაში, წყაროს თავზე, ხან ტყეში და სოფლის არემარე სულ შემოიარა.\nმოიგონა ქართული ენაც, თუმცა სიტყვები ბლომად აკლდა, ლაპარაკის\nდროს ჩერდებოდა, ან ლეკურ სიტყვებს ურევდა და ამ დროს დედა\nქართულ სიტყვებს ასწავლიდა.აღმოჩნდა, რომ პირველი წლების\n\nშთაბეჭდილებანი და ჩასახულებანი კი არ გამქრალიყვნენ და არ\nწაშლილიყვნენ ქეთოს გონებაში, თურმე, ღრმად ეძინათ, დამარხული\nიყვნენ მისი სახსოვრის სიღრმეში, ძირში,როგორც მცენარის თესლია\nდამარხული მიწაში, და ზევიდან მათ ეფარათ მთელი ათი წლის ნანახი\nდა ნაცადი დაღესტანში ყოფნის დროს. ამ ჩასახულებათა დაძვრა და\nგამოღვიძება შეეძლო მხოლოდ რომელსამე ძლიერსა და ღრმა\nშთაბეჭდილებას სწორედ ისე, როგორც მცენარის თესლს ზევით\nამოიყვანს ხოლმე გამაცოცხლებელი მზის სითბო-სინათლე. ამისთანა\nმზეებრივი შთაბეჭდილების მოხდენა ქეთოს გონებაში შესძლო მხოლოდ\nსამშობლო ხმამ, საბავშვო სიმღერამ: “იავნანამ”, რომელიც ყველაზე\nუფრო ღრმად ჰქონდა ქეთოს ძვალსა და რბილში გამჯდარი.ყოველი\nვაშლოვანელი, დიდი თუ პატარა, ქალი თუ კაცი, გახარებული იყო\nქეთოს გონზე მოსვლით. მოდიოდნენ და ულოცავდნენ მაგდანსა და მის\nქმარს და შეჰხაროდნენ ქეთოს. ქართველაძის სახლში სიხარული\nტრიალებდა. ამ ძლიერ სიმხიარულეს სწორედ შეჰფეროდა და ბანს\nაძლევდა ხშირი სიმღერა მაგდანისა. როგორც დიდხანს უწყლოდ\nყოფილი შველი, ხარბად ეწაფება წმინდა წყალსა და გაძღომა მალე არ\nეკიდება, ისე ქეთო, მთელს ათს წელიწადს მოკლებული თავის\nუსაყვარლეს სიამოვნებას, გაუმაძღრად ეწაფებოდა დედის სიმღერას და\nმაგდანს მოსვენებას არ აძლევდა. ერთ ხმას რომ გაათავებდა მაგდანი,\nახლა მეორეს ათქმევინებდა, მერე მესამეს, მეოთხეს, ხშირად მაგდანი\nეტყოდა ხოლმე: — გენაცვა, შვილო, ცოტა დამასვენე, თორემ არაქათი\nაღარ მაქვსო. მაგრამ ქეთომ უებარი წამალი იცოდა ამ დაღალულობისა:\nმხურვალე ხვევნა და კოცნა დედისა. ქეთო თანა სტკბებოდა დედის\nმშვენიერი სიმღერით და თან თვითონაც სწავლობდა სიმღერას.\nქეთო და მისი დედობილ-მამობილი ერთხელ, როდესაც ქეთომ გული\nიჯერა ახალი ცხოვრებით, ჰკითხა დედას: — დედილო, გენაცვა, არ\nშეიძლება, რომ დაღესტანში მოკითხვა ვისმე პირით შევთვალო?\nმაგდანს ეს სიტყვა არ ესიამოვნა და შეკრთა.\n\n— ფიქრი ნუ გაქვს, დედა! — შვილებრივი სიყვარულით უთხრა ქეთომ.\n— შენ და მამაჩემი მიყვარხართ, როგორც ღვიძლი მშობელნი, იმათ კი\nპატივსა ვცემ, როგორც ჩემს მოამაგეთ და ჩემს აღმზრდელთ. ისინი რომ\nარ ყოფილიყვნენ, ვინ იცის, ვის ხელში ჩავვარდნილიყავ და რა\nმომსვლოდა.მოკითხვა შეუთვალეს ნაიბს და მის ცოლს საგანგებოდ\nგაგზავნილი კაცების პირით და ძღვნადაც გაუგზავნეს ჩინებული კახური\nღვინო, რომელსაც მაშინდელი ლეკები კახელებზე ნაკლებად არ\nეწყობოდნენ.\nზაფხული გადიოდა. დედა ატყობდა, რომ ქეთოს ძლიერ უნდოდა ნახვა\nთავისი დედობილ-მამობილისა, მაგრამ არ კი ამბობდა ამას. ერთხელ\nმაგდანმა უთხრა ქეთოსა: — იცი, ჩემო კარგო, რა აზრი მომივიდა? ახლა\nრთველი ახლოვდება, დაღესტანში ვენახები არ არის და რთველი იქ არ\nიცის. მოდი, რთველში მოვიწვიოთ შენი დედობილ-მამობილი და\nვასიამოვნოთ, სიკეთეს გადახდა უნდა. — მადლობის ნიშნად ქეთო\nდედას მხურვალედ გადაეხვია.\nნაიბსა და იმის ცოლს ძალიან უნდოდათ ქეთოს ნახვა, ამიტომ რთველში\nმოწვევამ გაახარა და დანიშნულ დროზე ეწვივნენ თავის შვილობილის\nდედ-მამას. დედ- მამის ნებართვით ქეთო თავის დედობილ-მამობილს\nლეკური ტანისამოსით მიეგება. ქეთოს სიხარულს საზღვარი არა ჰქონდა,\nრადგანაც ერთად ხედავდა ოთხ ძვირფას თავისიანს, რომელნიც გულითა\nდა სულით უყვარდა.\nზურაბი და ნაიბი დამეგობრდნენ, მაგდანმაც გულით შეიყვარა ნაიბის\nცოლი და ამიტომ ყოველ შემოდგომაზე მათი რთველში მოწვევა წესად\nდასდეს. ეს წესი არ შეცვლილა მას უკანაც, როცა რამდენიმე წლის შემდეგ\nქეთო გათხოვდა დედის სამშობლოში და ჯვარი დაიწერა ერთ ღირსეულ\nქართლელ ვაჟკაცზე. ყოველ ენკენისთვეში ქართველაძეს ქართლიდან\nეწვევოდნენ ხოლმე ქალი და სიძე, დაღესტნიდან ნაიბი ცოლით და\nამალით. არა გვგონია, რომ ვისმე თავის სიცოცხლეში რთველი ისეთი\nსიამოვნებითა და ბედნიერებით ეტარებინოს, როგორც ატარებდა ქეთო.\n\nქეთოს ბედნიერება\nმაგრამ განა მარტო რთველობის დროს იყო ქეთო შვებითა და ლხენითა?\nარა, სხვა დროსაც. ბრძენნი ამბობდნენ და ამბობენ, რომ საუკეთესო\nწყარო ადამიანის ბედნიერებისა მოსიყვარულე გულიაო.\nძლიერი, წმინდა სიყვარული მოყვასისადმი, თვით მოსიყვარულესაც\nუტკბობს სიცოცხლესა და მოყვასსაცაო. სიმდიდრეც შეიძლება ადვილად\nდაჰკარგოს ადამიანმა, სიმართლესა და სილამაზესაც მოაკლდეს,\nნათესავებიც შეიძლება უდროოდ დამარხოს, მაგრამ მოსიყვარულე გული\nკი ათბობს და ანათებს მის სიცოცხლეს თვით სამარის კარამდისაო.\nქეთოს დედისგან დაჰყვა მეტად მოსიყვარულე გული, და ამ გულს\nძლიერ მოუხდა იშვიათი მისი თავგადასავალი. ამ თავგადასავალმა\nძლიერნი მოძრაობანი გამოაცდევინა ქეთოს გულს და ავარჯიშა იგი.\nღრმა გრძნობანი გულისა ჯერ დედ-მამის სიყვარულზე აღიზარდნენ,\nმერე ძლიერ ჯავრზე, რომელიც გამოაცდევინა მას მოტაცებამ ლეკების\nმიერ, შემდეგ დედობილ-მამობილის სიყვარულზე. მას უკან ფრიად\nღრმასა და ხანგრძლივს ნაღველზე, რომელიც მოჰყვა მამისაგან\nმოტაცებას, მას შემდეგ სიყვარული ღვიძლი დედ-მამისა და დედობილ-\nმამობილისა ერთად შეერთდა ქეთოს გულში, ბოლოს ამას დაემატა\nღირსეული ქმრისა და შვილების სიყვარული, და ამ სახით ქეთოს გული\nგახდა დაუშრობელი წყარო კაცთმოყვარებისა, გაუქრობელი ლამპარი\nსიყვარულისა მოყვასისადმი. ქეთოს, გამომცდელს ცხოვრებაში დიდი\nნაღველისაცა და ძლიერი სიხარულისაც, ყოველთვის და ყოველგან\nჰქონდა ტკბილი ალერსი ყველა ბავშვისათვის, ცრემლი უბედურთათვის,\nნუგეში დაჩაგრულთათვის, შემწეობა გაჭირვებულთათვის, მოწყალება\nგლახაკთათვის. მას თავისიანად მიაჩნდა ქართველებიც და ლეკებიც,\nსაქართველოც და დაღესტანიც, და რადგან სიყვარული შობს სიყვარულს,\nამიტომ ქართველები და ლეკები, თითქოს ეჯიბრებოდნენ ერთმანეთს,\nვინ უფრო მეტს პატივისცემას, მეტ ხათრსა და მეტ სიყვარულს\nუჩვენებდა ქეთოს. ქეთო თავისი მოსიყვარულე გულით გარშემო ჰფენდა\nლხენასა და შვებასა, როგორც ვარდის აყვავებული ბუჩქი ჰფენს თავის\n\nგარშემო საამურ სურნელებას, და როგორც ამ ბუჩქს ყველა შეჰხარის,\nყველას უყვარს, ისე ყველა შეჰხაროდა და ყველას უყვარდა ქეთო,\nრომელიც ერთსა და იმავე დროს სტკბებოდა თავისი სიყვარულით\nმოყვასისადმი და მოყვასთა სიყვარულით თავისადმი. უკეთესიღა\nბედნიერება განა იქნება ამ ქვეყანაზე?", "pages": "7–26"}, {"title": "ასპინძის ომი", "text": "მამული ვეღარ იხილავს ირაკლის ხმალსა მღელვარეს, დიდება ივერიისა\nმასთან მარხია სამარეს.\nგრ. ორბელიანი\n1. შესავალი\nმშვენიერი სანახავია მოწმენდილი ცა განთიადის წინ. ლაჟვარდის ფერი\nგაუზომელი გუმბათი მოჭედილია ბრწყინვალე ვარსკვლავებითა და\nესენი განუწყვეტლივ ებრძვიან ღამის სიბნელესა და ჰფენენ\nდაუსრულებელს სივრცეში სინათლესა და ლხენასა. ამ სასიქადულო\nქვეყნის სამსახურში ყველაზე მეტად დაწინაურებულია ორი მნათობი:\nცისკარი და ხარისთვალა. ესენი ჩვენს დედამიწას ისე უხვად უგზავნიან\nსინათლესა, რომ ბნელს ღამეს ამსგავსებენ ნათელს დღესა. ქება და\nდიდება ცის მნათობებსა და უპირველესად ყოვლისა მათ შემოქმედსა.\nასეთსავე საოცარს სამზერს წარმოადგენს სამოცდახუთის წლის მეფობა\nწარსულს საუკუნეში ერეკლე მეორისა, ანუ “პატარა კახისა”. იგი\nდაუსრულებელი ბრძოლაა სინათლისა სიბნელესთან, თავისუფლებისა\nმონობასთან, ბრძოლა, სავსე საოცარი ვაჟკაცობით, მრავალის\nბრწყინვალე გამარჯვებათ შორის ორი კაშკაშებს განსაკუთრებული\nშუქითა. ერევნისა და ასპინძის ომი — აი ხარისთვალა და ცისკარი\nერეკლეს სამხედრო მოქმედებაში.\nპირველს — ერევნის — ომში ჩვენი სახელოვანი მეფე სამი ათასი კაცით\nშეებრძოლა თვრამეტ ათას სპარსელს ჯარსა, თავისი ხელით მოუკლა მას\n\nერთი საუკეთესო წინამძღოლთაგანი, შიშის ზარი დასცა მტერსა, სძლია\nიგი, დააყრევინა ბევრი ზარბაზანი, წაართვა მრავალი სიმდიდრე და\nსაშინლად დამარცხებული გააქცია.\nმეორე — ასპინძის — ომში ისე იჩინა თავი, ისეთი საოცარი ვაჟკაცობა და\nსამხედრო ხელოვნება გამოიჩინა, რომ მთელი ევროპა გააცვიფრა,\nაღტაცებაში მოიყვანა თვით ფრიდრიხ დიდი, პრუსიის უძლეველი მეფე,\nდა სახელად დაერქვა “ასპინძის გმირი”. ქება და დიდება ერეკლე მეფის\nსახელსა და დღეგრძელობა მის დამბადებელს და აღმზრდელს ქვეყანასა!\n2. იმპერატრიცა ეკატერინე და ერეკლე მეფე\nმე ამ ჟამად მწადია მოგითხროდ ამბავი მხოლოდ ასპინძის ომისა.\n1769 წელსა რუსეთის იმპერატრიცამ ეკატერინე მეორემ ომი გამოუცხადა\nოსმალეთსა. ამავე დროს მისწერა ქრისტიან ხალხებს, რომელნიც შავ\nზღვას იქით ცხოვრობდნენ და ცხოვრობენ, რომ ისინიც\nშეიარაღებულიყვნენ, რუსეთისათვის მხარი დაეჭირათ და\nგალაშქრებულიყვნენ ოსმალეთზე, ამ ქრისტიანობის მტერზედა. ესევე\nმოსწერა იმერეთის მეფეს სოლომონსა და ქართლ-კახეთის მეფეს\nერეკლესა. ბერძნებს, ჩერნოგორელებს, სერბიელებს, ბოლგარელებს და\nსხვა ხალხებს ბალკანეთის ნახევარკუნძულისას ეშინოდათ ოსმალეთისა\nდა ყური მოიყრუეს, ომში მონაწილეობა არ მიიღეს. სრულიად\nსხვარიგად მოიქცა ერეკლე მეფე. მაშინვე შეუდგა სალაშქრო მზადებას\nდა ომიც გამოუცხადა ოსმალეთსა. ესე მოიქცა ჯერ იმიტომ, რომ\nუნდოდა ეამებინა ეკატერინესათვის და რუსეთთან კავშირი\nგანემტკიცებინა, და მეორე იმიტომ, რომ ამ ომიდან ის თავისი\nსამეფოსათვის დიდს სიკეთეს\nმოელოდა. ჯავახეთი და ახალციხის მხარე, ქართველი ტომით\nდასახლებული, უძველესი დროიდან საქართველოს ეკუთვნოდნენ;\nმაგრამ იმის წინა საუკუნეში ოსმალეთმა ისარგებლა საქართველოს\nსისუსტით, ეს ქვეყნები გამოჰგლიჯა ხელიდან და დაისაკუთრა. და აი,\nერეკლეს ეწადა რუსეთის ჯარის დახმარებით წაერთმია ეს ორი მხარე\n\nოსმალეთისათვის და შემოეერთებინა საქართველოსთანა.\nუფრო კიდევ მომეტებული სიამოვნებით მიემხრო რუსეთს სოლომონ\nმეფე, რომელიც უამისოდაც ებრძოდა ოსმალეთსა.\n3. ერეკლე მეფე და ტოტლებენი\nსოლომონ მეფის და ერეკლეს მოსაშველებლად იმპერატრიცა ეკატერინემ\nრუსეთიდან გამოგზავნა ოთხი ათასი ჯარისკაცი, გენერალის\nტოტლებენის\nწინამძღოლობით. ეს ჯარი გადმოვიდა კავკასიონის ქედზე სამხედრო\nგზით, გაიარა ქართლი და დაიბანაკა სურამსა. ერეკლემაც მალე შეჰკრიბა\nშვიდი ათასი კაცი, წაიღო სამი ზარბაზანი და წაიყვანა თან თავისი\nმემკვიდრე გიორგი და ორი ეპისკოპოზი მოძრავი საყდრითურთ...\nშეერთება ჩვენისა და რუსეთის ჯარისა მოხდა სურამთან. აქედან\nშეერთებულმა ლაშქარმა გასწია ბორჯომის ხეობისკენ ოსმალებთან\nსაბრძოლველად. ეს იყო 1770 წლის აპრილის დამდეგსა. გზაზე\nმოულოდნელად ჩამოვარდა განხეთქილება ერეკლესა და ტოტლებენს\nშორის... რა იყო ამის მიზეზი? ტოტლებენს უნდოდა ხელში ეგდო\nშეერთებულის ქართველ-რუსთა ჯარის უფროსობა და თავის ნებაზე\nწაეყვანა საქმე. ერეკლე კი ჰფიქრობდა, რომ წინამძღოლობა და ბატონობა\nმე მეკუთვნის, როგორც მეფესა და გამოცდილ სარდალსაო.\nგანხეთქილებამ თანდათან იმატა და სიძულვილად გადაიქცა.\nშეერთებული ჯარი მაინც წინ მიდიოდა, გაიარა ტაშის კარი, შევიდა\nბორჯომის ხეობაში, ასცილდა ბორჯომსა და მიადგა აწყურის ციხესა,\nრომელსაც იცავდა ოსმალეთ-ლეკების ჯარი. ძველი აწყურის\nციხე,აქამომდე დარჩენილი, აშენებულია მტკვრის მარჯვენა ნაპირზე,\nმიუვალს კლდეზე; აქვს მეტად განიერი და მაგარი კედლები და მისი\nაღება ძლიერ ძნელი იყო იმ დროს. ერეკლე მეფე იმ აზრზე იდგა, რომ\nაწყურისა და ახალციხის ციხეებისათვის მხარი აექციათ, გარეშე მყოფი\nჯარი მტრისა დაემარცხებინათ, სადაც კი შეხვდებოდათ, გარშემო\nქვეყნები დაეჭირათ, მეციხოვნე ჯარები გაემარტოებინათ, საჭმელ-\n\nსასმელის მიწოდება შეუძლებელი გაეხადნათ და სიმშილ-წყურვილით\nბოლოს და ბოლოს დაემორჩილებინათ. ტოტლებენს კი დიდი იმედი\nჰქონდა თავისი ზარბაზნებისა და ჯიუტად ამტკიცებდა, რომ უკეთესი\nიქნება ჯერ ციხეები აწყურისა და ახალციხისა ავიღოთ და მერე ეს ქვეყანა\nდავიპყროთო. ერეკლე იძულებული შეიქნა უნებლიედ\nდათანხმებულიყო, ალყა შემოარტყეს აწყურის ციხესა. ერთი მხრით\nმიადგა ქართველი ჯარი, მეორე მხრით რუსთა ჯარი თავისი\nზარბაზნებითა. ამათ ასტეხეს ხშირი სროლა ზარბაზნებისა და\nთოფებისა; ციხის ზარბაზნებმა და ჯარმაც პასუხი გასცეს და გაჩაღდა\nჭექა-ქუხილი, რომელსაც გარშემო ხეობა ბანს აძლევდა. მთელი ორი დღე\nიომეს ამგვარად და ციხეს ცოტაოდენი ზიანიც არ მისცემია. მისი\nუმაგრესი კედლებიდან ისე ცვიოდა მოხვედრილი ტყვია, როგორც\nსახლის კედელსა სცვივა შეყრილი ცერცვი. მესამე დღეს უცებ მოახსენეს\nერეკლეს, რომ ტოტლებენმა ჩუმად ციხეს თავი დაანება და თავისი\nჯარით ქართლისაკენ გასწიაო. საშინლად განცვიფრებული მეფე\nდაედევნა უკან ტოტლებენსა, მოეწია და სთხოვა: ოღონდ უკან\nდაბრუნდი, ნუ მიღალატებ და მზად ვარ ჯარის უფროსობა შენ\nდაგითმოვო და ყოველი შენი სურვილი აღვასრულოვო. ტოტლებენი\nუარზე დადგა. რა საბუთით? ჯერ სთქვა:ჯარისათვის საკმარისი სურსათი\nარა მაქვს, ცხენებისათვის, საკვებიო. ერეკლემ უპასუხა: გარშემო\nსოფლებში მყავს კაცები გაგზავნილი და იმდენს საჭმელს და საკვებს\nმოიტანენ, რომ თავზე საყრელი გექნებათო, ოღონდ უკანვე დაბრუნდით\nდა მტერთან ერთად გავაგრძელოთ ომი. მერე სთქვა ტოტლებენმა:\nბრძანება არა მაქვს ჩემი ხელმწიფისა ვიომო ახალციხის საფაშოშიო;\nმტერი მრავალია და ძლიერი, მე ჯარი ცოტა მყავს და საშიშია ომის\nგაგრძელებაო. ერეკლე მაინც ეხვეწებოდა, ტოტლებენი კი მხოლოდ\nბოდიშს იხდიდა მეფის წინაშე და დაბრუნებაზე კი ცივს უარს\nეუბნებოდა. მაშინ ბატონიშვილი გიორგი, ერეკლეს უფროსი შვილი,\nმოთმინებიდან გამოვიდა და უთხრა თავისს მამასა: დაანებე თავი,\nწაეთრიოს სადაც უნდა, ჩვენ მარტონიც გავიმარჯვებთ მტერზე და მაგას\n\nთავზე ლაფს დავასხამთო.ტოტლებენი ქართლისკენ გამოეშურა, ერეკლე\nკი ისევ დაბრუნდა თავის ჯართანა. ერეკლე ასე ხსნიდა ტოტლებენის\nსაქციელსა: ალბად მას იმედი აქვს, რომ მე ვითაკილებ უკან დახევასა,\nშევებრძოლები ოსმალთა ჩემი მცირე ჯარითა, დავმარცხდები, ჯარს\nდავკარგავ, მეც დავიღუპები ჩემი მემკვიდრითურთ და მაშინვე ჩემს\nსახელმწიფოში ბურთი და მოედანი მას დარჩებაო.\n4. ნაყოფი ტოტლებენის ღალატისა\nრუსთა ჯარის უკან მოქცევამ ძლიერ ცუდად იმოქმედა ქართველებზე.\nესენი ისე გაბრაზდნენ, რომ კინაღამ საშინელი საცოდაობა არ\nდატრიალდა. ერეკლესთან შუაკაცად გამოგზავნილი იყო რუსეთიდან\nთავადი მოურავოვი, გარუსებული ქართველი, შვილი რუსეთში\nგადასახლებული ქართველისა. ეს მოურავოვი დაიბადა რუსეთში, იქ\nაღიზარდა და სამსახურშიაც იქვე შევიდა. მან რუსულის ენის გარდა\nქართულიც იცოდა და ამიტომ კარგათ შეეძლო შუაკაცობა გაეწია\nრუსეთსა და საქართველოს შორის. ამ მოურავოვს თან ახლდნენ რუსის\nმოსამსახურენი და რამდენიმე კაზაკი. და აი გულმოსულნი ქართველნი\nჯარისკაცნი მიესივნენ ამ რუსებსა და მათზე უნდა ეყარნათ\nტოტლებენის ჯავრი. მაგრამ ერეკლემ და სხვებმა ჯარს აუხსნეს, რომ\nტოტლებენი ჩამომავლობით რუსი არ არის, რომ იმან წინეთ რუსეთსაც\nუღალატა, რის გულისათვის კინაღამ დახვრიტეს, რომ რუსეთის\nაფიცრები და ჯარისკაცნი თვითონაც ძლიერ გულმოსულნი არიან თავის\nწინამძღოლზე, მაგრამ უნდა მორჩილობა გაუწიონ, როგორც თავის\nუფროსსაო. ძლივ-ძლივობით დააშოშმინეს ჯარი.\nტოტლებენის მოულოდნელმა საქციელმა სხვა შედეგიც დაბადა.\nქართველი ჯარი საგონებელში ჩავარდა. ეტყობა, ოსმალოს დიდი ჯარი\nჰყოლია, რომ ტოტლებენს შეეშინდა, ზურგი მტრისკენა ჰქნა და\nქართლისაკენ გასწიაო. ამ შეძრწუნებითი სარგებლეს ოსმალებმა, უცებ\nგამოვიდნენ ციხიდან, დაესხნენ თავს ქართველებსა და თუმცა ბრძოლის\nშემდეგ უკუქცეული იქნენ, მაგრამ ოთხმოცამდე ქართველი ტყვედ\nშეიტაცეს ციხეში.\n\nმდგომარეობა ძლიერ გაჭირვებული იყო. ხოლო სწორედ ამისთანა\nგაჭირვებულ შემთხვევაში გამობრწყინდებოდა ხოლმე ერეკლეს საოცარი\nგავლენა ჯარზე. რამდენიმე მარჯვე სიტყვით ერეკლე ყოველ თავის\nჯარისკაცში სრულიად გააქრობდა ხოლმე შიშსა და ჩაჰბერავდა\nვაჟკაცობის და მამაცობის სულსა, მხდლებსაც კი გმირებად გადააქცევდა\nხოლმე...მეფემ დაუარა თავის ჯარსა, მოაგონა, რომ ქართველებს თავისი\nსაკუთარი ძალ-ღონით და ვაჟკაცობით მრავალჯერ დაუმარცხებიათ\nათჯერ და ოცჯერ მათზე მეტი მტერი, და ბოლოს უთხრა: ჩვენ ან უნდა\nგავიმარჯოთ მტერზე, ან მთლად დავიხოცნეთ აქა. ისე დაბრუნება კი\nსამშობლოში ჩვენთვის თავზე ლაფის დასხმა იქნება. რა უნდა ვუთხრად\nჩვენს დედებს, ჩვენს ცოლებს, ჩვენს დებსა, მთელს ქართველობას, როცა\nხელცარიელნი მივალთ შინა. განა ამისთანა ლაჩრობა ქართველებს\nშეჰფერის? არა, ძმებო, ჩვენ უნდა მოვიქცეთ ისე, როგორც წინეთ\nმოვქცეულვართ, როგორც შეჰფერის ქართველთა მამაცობას და\nვაჟკაცობას. წინ და არა უკან...\n5. ქართველი ჯარი როკეტის გზაზე\nთბილისიდან რომ გამოვიდა ერეკლე, მხოლოდ სამი ზარბაზანი წამოიღო\nთან, რადგანაც ტოტლებენის ზარბაზნების იმედი ჰქონდა, სამი\nზარბაზნით კი აწყურის ციხის აღება ყოვლად შეუძლებელი იყო მოკლე\nხანში... ერეკლე საგონებელში ჩავარდა და არ იცოდა, აწყურთან\nდარჩენილიყო დროებით, თუ წინ წასულიყო ახლავე. ამ დროს მას\nჯავახებმა ამბავი მოუტანეს, რომ ოსმალოს ჯარი ასპინძის მოკლე გზით\nაპირობს მოეშველოს აწყურსაო.აქ საჭიროდ მიგვაჩნია გაუწყოთ, რომ\nასპინძისაკენ აწყურიდან ორი გზა მიდიოდა: ერთი მტკვრის მარცხენა\nნაპირზე, მეორე მარჯვენაზე. პირველი გზა იყო შარა გზა, განიერი და\nსწორი, მაგრამ ძლიერ გრძელი. მას ერქვა ახალციხის გზა. ამ გზით რომ\nწასულიყო ერეკლე, ჯერ ახალციხემდის უნდა გაევლო ოცი ვერსი, მერმე\nახალციხიდან აღმოსავლეთისაკენ ექმნა პირი, გაეარნა კიდევ ოცდაათი\nვერსი და მისულიყო ასპინძასა. მეორე გზა მეტად მოკლე იყო,\nასპინძამდის სულ ოცს ვერსს შეადგენდა, მაგრამ, სამაგიეროდ, ვიწრო\n\nიყო, ოღროჩოღრო. უმეტესად მთა-მთა მიდიოდა და ძლიერ\nაბრკოლებდა თავისუფალს მოძრაობასა, სიარულსა. ერეკლემ ეს ძნელი\nგზა არჩია, რადგანაც მტერი თურმე ამ მოკლე გზით აპირებდა\nმოშველებოდა აწყურსა. ამ მოკლე გზას როკეტის გზა ერქვა, რადგანაც\nროკეტის მთაზე გადადიოდა.\n6. ქართველი ჯარის განსაცდელი იდუმალასთან\nერეკლემ აჰყარა ალყა აწყურს. დასძრა თავისი ჯარი და გაუძღვა როკეტის\nგზაზე. ჩვენი ჯარი ძლიერ ნელა მიდიოდა ცუდ და უცნობი გზის გამო.\nშეიტყო თუ არა ალყის აყრა აწყურის ციხეში მყოფმა მტრის ჯარმა, იგი,\nუმეტეს ნაწილად, გამოვიდა სიმაგრიდან, უფრო მოკლე გზა აირჩია,\nგაუსწრო წინ ჩვენ ჯარსა, წინ უყელა, შეუერთდა თავიანთ ჯარს, ასპინძის\nახლო მყოფსა, შეადგინა ორი ათასი ლაშქარი და უცებ თავს დაესხა\nქართველ წინა ჯარსა იდუმალას მახლობლად. ბლომა ნაწილი ჩვენი\nჯარისა უკან იყო დარჩენილი, წინა ჯარსაც მტერმა მოასწრო უხერხულს\nალაგს, მოულოდნელად მიიტანა მასზე იერიში და ამიტომ ჩვენი ჯარი\nაირია, შეძრწუნდა და ზურგი აქცია მტერსა. საშინელი\nდამარცხება ვერ ასცდებოდა ქართველთა ჯარსა, თუ რომ მეფის\nსამაგალითო გულადობას არ ეხსნა იგი დიდის განსაცდელისაგან.\nერეკლე პირადად გაექანა “რაოდენიმე ჩინებულითა და შინა ყმითა\nთვისითა და შვიდით ხევსურითა, განსწირა თავი თვისი და ეკვეთა\nფიცხლად, ვიდრე სიკვდილამდე”... გამოქცეული ჩვენი ჯარი, როცა მან\nთავისი უსაყვარლესი მეფე განსაცდელში დაინახა, გონზე მოვიდა, ისევ\nაივსო მამაცური გამბედაობით, მიუბრუნდა მტერსა, დაესხა თავსა და\nსაშინლად დაამარცხა. მტრის ორი ათასი კაციდან ათასმა ძლივს უშველა\nთავსა გაქცევითა. ნახევარი ჯარი ოსმალ- ლეკებისა ბრძოლის ველზე\nდარჩა დახოცილი და დაჭრილი.\nამ შემთხვევაში ერეკლე უნებლიედ მოგაგონებთ იულიუს კეისარსა,\nპირველს სარდალს ძველის დროისას. როცა ისპანიაში პომპეუსის\nშვილების ჯარმა ზურგი აქნევინა კეისარის ჯარსა და გამოაქცია, ეს\n\nსწრაფად მოაჯდა თავის ცხენსა, მჭეხარი ხმით შესძახა: “განა ამ ბალღებს\nუნდა დავემარცხებინოთო!” და იერიში თვითონ მიიტანა მტერზე.\nგაქცეულმა ჯარმა რომ თავისი უძვირფასესი წინამძღოლი დაინახა\nსაშინელს ხიფათში, მობრუნდა, მამაცურად შეება მტერსა და საშინლად\nდაამარცხა.\n7. დაბანაკება ჩვენი ჯარისა ასპინძის სერებზე\nხოლო მთავარი განსაცდელი ერეკლესი ჯერ წინ იყო. ამ ომს შემდეგ არ\nგასულიყო რამდენიმე საათი და დაღალულს ჯარს ჯერედ არ დაესვენა,\nრომ ერეკლეს ამბავი მოუტანეს: შენზე ახალციხიდან მოდის მთავარი\nჯარი ოსმალ-ლეკისა, რიცხვით ათი ათასი, და რამდენიმე საათის შემდეგ\nგამოვა მტკვარსა და თავს დაგესხმებაო. ამ დროს ერეკლეს თანა ჰყავდა\nსულ ოთხი ათასი მეომარი, დანარჩენი ზოგი სურსათზე იყო წასული,\nზოგი უკან იყო დარჩენილი და ზოგიც ჭრილობით და ავადმყოფობით\nიყო შეპყრობილი. სამწუხაროდ, ეს ოთხი ათასი კაციც მარტო\nქართველთაგან როდი იყო შემდგარი. მათში ერია ათასი ბორჩალოელი\nთათარი, რომელთაც ერეკლე სავსებით ვერ ენდობოდა. ამაზე უფრო\nგაჭირვებული მდგომარეობა განა ძნელი წარმოსადგენია? სამი ათასი\nქართველი უცხო ქვეყანაში უნდა შებრძოლებოდა ათი ათასს მტრის\nჯარსა. მაგრამ, როგორც უკვე ვთქვით, სწორედ ამისთანა უკიდერესს\nგაჭირვებაში თავს იჩენდა ხოლმე ერეკლეს საოცარი ნიჭი სარდლისა...\nერეკლემ კარგად იცოდა, რომ მარჯვე პოზიცია, მოხერხებული საომარი\nადგილი ყველაზე მომეტებულად იყო საჭირო გამარჯვებისათვის\nამისთანა ძალთა უსწორობაში. და სწორედ ამისთანა პოზიციის\nამორჩევას და დაჭერას დაეშურა დაუყოვნებლივ. მეფემ გაიარა იდუმალა\nდა მიმართა ასპინძის მაღლობებსა. ეს მაღლობები ჩამწკრივებული იყო\nიდუმალასა და ასპინძას შუა მტკვრის მარჯვენა ნაპირასა; მტკვარსა და ამ\nმაღლობებ შუა სულ ორი ვერსის სიგანე ვაკე იყო დარჩენილი და აი\nსწორედ ეს სერები აირჩია ერეკლემ საომარ ადგილად და აქ ჩაასაფრა\nთავისი მცირე ჯარი.\n\nმეფეს ჯარი გაყოფილი ჰყავდა სამ ნაწილად; ერთს ნაწილს თვითონ\nგანაგებდა, მეორეს უწინამძღვრებდა მემკვიდრე საქართველოს ტახტისა\nგიორგი ბატონიშვილი, უფროსი ვაჟი ერეკლესი, და მესამე ნაწილის\nუფროსი იყო დავით ორბელიანი. შუა მაღლობები ერეკლემ დაიჭირა\nთავისი ჯარითა, მარცხენა მაღლობზე გამაგრდა ორბელიანი, მარჯვენაზე\n— ბატონიშვილი გიორგი, რომლის პოზიცია კარგა მანძილზე იყო\nმოშორებული. ბატონიშვილს ნაბრძანები ჰქონდა მამისაგან, რომ თავისი\nჯარით ომში მონაწილეობა თავდაპირველად არ მიეღო, თავისი ძალღონე\nშეენახა შემდეგისათვის და გაჭირვების დროს, ან ბოლოს\nხანს,დასვენებული ჯარით იერიში მიეტანა მტერზე.ჯერ ქართველი\nჯარი კარგად არ იყო დაბინავებული ასპინძის მაღლობებზე, რომ\nთათრის ჯარმა დაიწყო გამოსვლა ხიდზედა, რომელიც ასპინძის ზემო\nმტკვარზე იყო გაკეთებული ჩქარა მთლად აავსო გრძელი და ვიწრო ვაკე\nდა მიუახლოვდა ქართველ ჯარსა. მაგრამ ღამემ უსწრო და ომი შემდეგის\nდღისათვის იქნა გადადებული.\n8. ასპინძის ომი\nორივე მხარე მთელს ღამეს საომრად ემზადებოდა. გათენდა თუ არა,\nთათრების ჯარმა წინ წამოწევა იწყო და, რაწამს თოფის მანძილზე\nმიუახლოვდა, ასტეხა ხშირი სროლა. ტყვია ხოშკაკალასავით მიდიოდა\nქართველი ჯარისკენ, მაგრამ მხოლოდ კლდეებს ადენდა მტვერსა, ჩვენს\nჯარს კი ვერას აკლებდა, ისე ოსტატურად იყო ჩამწკრივებული და\nამოფარებული სერებზე. მტრის ჯარი დაიმედებული იყო, რომ ერეკლეს\nმცირეოდენ ჯარს მთლად ხელში იგდებდა, და ამ იმედს ისიც\nუძლიერებდა, რომ ქართველების მხრივ ჯერ ერთი თოფიც არ\nგავარდნილიყო. მტერმა ეს შიშს დააბრალა და უფრო მეტი იმედი მიეცა,\nმაგრამ მალე აღმოჩნდა, რომ ეს ოსტატობის ხერხი იყო და არა შიშის\nბრალი. ერეკლესაგან ქართველ ჯარს ნაბრძანები ქონდა: ერთი თოფიც არ\nგაისროლოთ, ვიდრე მტერი ახლოს არ მოვაო და მაშინ კი ერთბაშად\nასტეხეთ ხშირი და მარჯვე სროლაო.\n\nაი ოსმალ-ლეკებმა სროლით ძლიერ ახლო მოატანეს ქართველ ჯარსა.\nუცებ ანიშნა ერეკლემ, დრო არისო, და დაიჭექა ჩვენების თოფებმა,\nმარჯვედ დამიზნებულმა. თითქმის ყველა ტყვია თავის დანიშნულებას\nეწია: პირველი რიგი მტრის ჯარისა ისე დაემხო დედამიწაზე, როგორც\nცელით ძირში მოჭრილი გამხმარი ყანა იქცევა ძირს. მეორე რიგმა მტრის\nჯარისამ, გამოცდილმა და\nგაფოლადებულმა ომებში, წარბიც არ შეიხარა, მამაცურად გადააბიჯა\nმკვდრებსა და დაჭრილს ამხანაგებზე და ჩასდგა პირველს რიგში... ხოლო\nმანამ გასროლას მოასწრებდა, ხელმეორედ იგრიალა ქართველთა\nთოფებმა და ეს რიგიც ჭერეხებივით მიწაზე დაემხო. მას ვაჟკაცურად\nგადმოაბიჯა მტრის მესამე რიგმა და დადგა წინ. სერებიდან მესამედ\nდაგრიალებულმა თოფებმა ამათაც ის დღე დააყენა. მაშინ მეოთხე რიგი\nშედრკა და ადგილიდან ფეხი ვეღარ მოიცვალა, მაგრამ არც აქ დააყარეს\nხეირი ქართველებმა. წინა რიგები მტრის ჯარისა ხომ ასე იჟლიტებოდა,\nარც უკან რიგებს ადგათ უკეთესი დღე. ორი ათასი თოფი ქართველის\nჯარისა სეტყვასავით აყრიდა ტყვიას თავზე ოსმალ-ლეკებსა. საქმეს ისიც\nუფრო უჭირებდა მტერსა, რომ ტყვია, მაღლობებიდან ქვემოთ\nდაშვებული, სულ თავ-პირში ხვდებოდა ორკეცი ძალითა. რადგანაც\nვიწრო ღელე მჭიდროდ იყო გაჭიკნილი მტრითა, ამიტომ თითქმის არც\nერთი ქართული ტყვია ტყუილად არ იკარგებოდა. ხმლით იერიშის\nმიტანა ოსმალ-ლეკებს იმის გამოც არ შეეძლოთ, რომ ხმალში\nქართველები ძლიერ მარჯვენი იყვნენ და თავისი მაღლობი\nადგილებიდან სულ ადვილად ამოსჩეხდნენ ახლო მისულს მტერსა.\nოსმალ-ლეკების ჯარი ძლიერ გაჭედილი იყო ღელეში, თავისუფალი\nმოძრაობა არ შეეძლო და ეს გარემოება კიდევ უფრო უშლიდა ხელსა.\nქართველებისაგან კი მოდიოდა და მოდიოდა ზუზუნ-ზუზუნით ტყვია\nდა ათხელებდა მტრის ლაშქარს. ოსმალ-ლეკნიც აუარებელს ტყვიას\nჰგზავნიდნენ ზეით ქართველებისაკენ, მაგრამ კლდეებს თუ\nამტვრევდნენ, თორემ მარჯვედ ჩასაფრებულს ჩვენს ჯარს ვერას\nაკლებდნენ, როგორც ზემოდაც შევნიშნეთ.\n\nმტრის ჯარი თანდათან მცირდებოდა და შიშს მიეცა. მისი სარდალი\nდარწმუნდა, რომ ამ მიუვალ პოზიციაზე ქართველებს ვერას დავაკლებთ\nდა ჩემს ჯარს მათ გავაჟლეტინებო. ამიტომ გადასწყვიტა: უკან-უკან\nდაეწია თავისი ჯარით, ხელახლად გაესხა იგი ხიდზე, მარცხენა ნაპირი\nმტკვრისა ჩაევლო, ქვემოთ სადმე ფონი ენახა, ამ ფონში გაესხა თავისი\nჯარი, უკანიდან მოეარნა ქართველი ჯარისათვის და დაემარცხებინა იგი.\nთათრის ჯარმა თანდათან იწყო უკანდახევა, თუმცა თოფის სროლას არ\nაკლებდა. მაშინ ერეკლეს ბრძანებით ქართველი ჯარი აიშალა\nმაღლობებიდან და თოფების ჭახაჭუხით ქვემოთ ღელეში ჩამოეშვა.\nთათრის ჯარმა რომ ეს დაინახა, შედგა, წინვე იწყო წამოსვლა და\nხელახლად გააჩაღა ომი. ერეკლემ აფრინა კაცი გიორგი მემკვიდრესთან,\nრომ თავისი ჯარი მოეშველებინა; მაგრამ ის, რაღაც უცნაურის მიზეზის\nგამო, ადგილიდან არ დაიძრა. ომი მეტად გამწვავდა. ერთ მხრივ\nიბრძოდა ათი ათასი თათარი, მეორე მხრივ, — ორი ათასი ქართველი.\n9. კოხტა ბელადის მოკვლა ერეკლეს მიერ და საშინელი განადგურება\nმტრისა...\nუცებ დაიძრა მტრის ჯარიდან ათასი ცხენოსანი ლეკი და\nხმალამოღებული ნიავსავით გამოექანა ქართველი ჯარისაკენ იერიშის\nმოსატანად. მას წინ მოუძღოდა, მოჰქროლავდა ახოვანი ვაჟკაცი,\nმშვენიერს ბედაურზე მჯდომი, კოხტა ბელადი, პირველ მეომრად\nცნობილი მთელს დაღისტანში. კოხტა მისმა ბედაურმა კარგა მანძილზე\nდააწინაურა. ჩვენი მხრიდანაც ისკუპა ცეცხლსავით სწრაფმა მერანმა და\nგაექანა კოხტასაკენ. ამ მერანზე იჯდა მშვენიერი შუატანის და შუახნის\nვაჟკაცი, ცოტა ბეჭებში მოხრილი, არწივისებურის თვალების პატრონი,\nმდიდარს ტანისამოსში გამოწყობილი; ამ ვაჟკაცს ყველა მოძრაობაში\nეტყობოდა საოცარი სისწრაფე და სიმარჯვე... ეს იყო ერეკლე მეფე,\nრომელიც ხმალამოღებული მიისწრაფებოდა გამოქანებულის მტრისკენ.\nერეკლეს ხმალამოღებულივე მოსდევდნენ შვიდნი წინათ ხსენებულნი\nსახელოვანნი ხევსურნი და სხვა ცხენოსანნი. დადგა საშინელი წამი.\nჩქარა ორივე ბედაურნი თითქმის ერთმანეთს შეეხალნენ. ერეკლესა და\n\nკოხტას ხმალმა ერთსა და იმავე წამს გაიელვა ჰაერში. დამიზნებული\nხმალი კოხტასი ერეკლემ მარჯვედ აიცდინა და თავისი ბასრი ხმალი\nდასთხლიშა საკვირველი სისწრაფით მტერს თავზე. კოხტას მზე\nდაბნელდა ბასრი მახვილით თავგაპობილი და თქრიალა სისხლში\nმოსვრილი, იგი მოსწყდა თავის მერანსა და დედამიწაზე ზღართა მოიღო.\nმაშინვე გაისმა ლომებრივი და მტრის სიკვდილის მომასწავებელი ხმა\nერეკლესი: ხმალი ამ წუნკალებსაო! ქართველი ცხენოსანი ჯარი,\nაღტაცებაში მოყვანილი მეფის საოცარი მამაცობით და სიმარჯვით მიესია\nმტერსა და დაუწყო უწყალოდ ჩეხა. კოხტას მოკვლამ, საზარელმა\nჭიხვინმა მისი ბედაურისამ, რომელიც უპატრონოდ გადარეული\nდარბოდა ოსმალ-ლეკების წინა, საშინელი თავზარი დასცა\nმტერსა,მოადუნა, დააუძლურა და ბრძოლის ძალა წაართვა მთლად.\nჩვენი ქვევითი ჯარიც მიესია თავზარდასხმულს ოსმალ-ლეკების\nლაშქარსა და სულ მუსრი გაავლო. მტერი სწრაფად იწევდა უკან და მას\nმხოლოდ ცოტათი ამხნევებდა ის იმედი, რომ ხიდამდის მივაღწევ,\nმტკვრის იქითა ნაპირს გავალ და გაქცევით თავს ვუშველიო. გარნა\nუბედურმა მტერმა არ იცოდა, რომ შორსმჭვრეტელი ერეკლე ამისთანა\nწინდაუხედაობას თავის დღეში არ ჩაიდენდა. უცებ მოისმა საცოდავი\nხმაურობა მტრის უკანა ჯარში, როცა იგი ხიდს მიუახლოვდა. ამ\nხმაურობამ ჩქარა უწია წინა ჯარამდის. რა ხმაურობა და ჟრიამული იყო\nესა? ეს ხმაურობა ჰფენდა მტრის ჯარში საზარელს ამბავს — ხიდის\nჩაშლას მტკვარზე.ადვილად მიხვდებით, რომ ხიდი ქართველებისაგან\nუნდა ყოფილიყო გაფუჭებული. და ასეც იყო. თავდაპირველადვე\nერეკლეს სრული იმედი ჰქონდა მტერზე გამარჯვებისა და უნდოდა\nგასაქცევი გზა შეეკრა იმისთვის. ამიტომ წინაღამეს უბრძანა სამს რჩეულს\nვაჟკაცს — ჩუმად წაესხათ რამდენიმე ჯარის კაცი, შეუმჩნევლად\nმიპარულიყვნენ ხიდთან და გაეფუჭებინათ. ეს ვაჟკაცნი იყვნენ: აღაბაბ\nერისთავი, სვიმონ მუხრან-ბატონი და ხუდია ბორჩალოელი. ამათ ისე\nოსტატურად და სწრაფად შეასრულეს ღამის სიბნელეში მეფის ბრძანება,\nრომ მტერს სრულიად არაფერი შეუტყვია. მეორე დღესაც ოსმალ-\n\nლეკთათვის ეს გარემოება შეუმჩნეველი დარჩა, რადგანაც ხიდი\nჩაფუშული როდი იყო, არამედ გადახერხილი ქონდა თავხეები. რაწამს\nპირველი რიგი გაქცეული თათრის ჯარისა შესდგა ხიდზე, თავხეები\nჩაიმტვრა, ხიდი ჩაიშალა და თან ჩაიტანა უბედურნი... ხიდის ჩაშლის\nამბავმა მტრის ჯარს მთლად წაართვა ძალა, გარდააქცია მხდალ ცხვრის\nფარად და მისცა სასოწარკვეთილებასა. ქართველები კი მეფის\nსამაგალითო გამარჯვებამ და საოცარმა ვაჟკაცობამ სიმამაცით აავსო და\nლომებად აქცია. და, აბა, მშიშარა ცხვრები რაღას გააწყობდნენ\nგააფთრებული ლომების წინააღმდეგ. სხვა გზა რომ აღარა ჰქონდათ,\nოსმალ-ლეკები ცვივოდნენ მტკვარში იმ იმედით, ეგები როგორმე იქით\nნაპირს გავაღწიოთო. მაგრამ ტყუილად. მაშინ აპრილი იდგა,\nწყალდიდობა იყო, მტკვარი აზვირთებული მოქუხდა და ამიტომ მასში\nგასვლა ძლიერ ძნელი იყო. და ან როგორ შეეძლოთ გაეღწიათ იქით,\nროდესაც ერთმანეთს ელალებოდნენ, პირველს რიგს, ჩაცვივნულს\nმტკვარში, მეორე რიგი ზემოდან ეცემოდა, მეორეს მესამე და ერთმანეთს\nაძირვინებდნენ მტკვარსა, ირჩობოდნენ, იღუპებოდნენ. ერთი მხრივ\nმტერი იჟლიტებოდა ქართველთა ხმლითა და ხანჯლითა, მერე მხრივ\nადიდებული მტკვარი ნთქავდა მას თავის ზვირთებში. მტკვარი ისე\nგაივსო დამრჩვალი ოსმალ-ლეკებითა, რომ ბევრს ადგილს ნაპირებიდან\nგადმოვიდა. ამასთან მთელი მდინარე წითლად შეიღება ნაკადულებად\nდაღვრილი სისხლისაგან.იმდენი ჯარი ოსმალ-ლეკებისა თითქმის\nმთლად დაიღუპა. სამი ათასი კაცი შეიქმნა მსხვერპლი ქართველთა\nიარაღისა და მოჰფინა ბრძოლის ველი. სხვანი ჩანთქა მტკვრის\nზვირთებმა. მხოლოდ ორმოცამდე კაცი გადარჩა. ესენი ადრიანად\nშეცვივდნენ ბედაური ცხენებით მტკვარში, რის ვაი-ვაგლახით გააღწიეს\nიქითა ნაპირასა და გაქცევით უშველეს თავსა. სამოცამდე მეომარი ტყვედ\nჩაუვარდათ ქართველებს ხელში. ბევრი წარჩინებული მტერი და\nმრავალი საუკეთესო ვაჟკაცი, ოსმალო თუ ლეკი, გამოესალმა\nწუთისოფელსა. ოსმალთა მხრივ აქ მოკლულ იქმნა გოლა- ფაშა და\nსრულიად ამოსწყდა მთელი ბეგობა ახალციხის საფაშოსი. ლეკთაგან,\n\nგარდა კოხტა ბელადისა, აქ დაიხოცნენ სამნი წარჩინებულნი ბელადნი,\nმთელს დაღისტანში ცნობილნი საუკეთესო ვაჟკაცებად, და ათასამდე\nრჩეულნი ცხენოსანნი. მთელი საომარი იარაღი, ზარბაზნები, ფული,\nთვალმარგალიტი, ცხენები და სხვა სიმდიდრე მტრისა ქართველებს\nჩაუვარდათ ხელში.\nქართველებს როგორღა დაუჯდათ ეს სახელოვანი გამარჯვება: ძვირად,\nთუ იაფად? ძალიან იაფად, ისე იაფად, რომ კაცი ძნელად დაიჯერებს, თუ\nკარგად არ იცის ამ ომის ამბავი და ერეკლე მეფის უმთავრესი ღირსება.\nმოიკლა ასპინძის ომში მხოლოდ ოცდაათი ქართველი და ასიოდე\nდაჭრილი იქმნა. მოკლულებში არც ერთი გამოჩენილი გვამი არ\nმოიპოვებოდა; მხოლოდ დაჭრილებში ერია ორი სახელოვანი სარდალი:\nჯარის ერთი უფროსთაგანი ალექსანდრე ციციშვილი და იასე ერისთავი.\nმაგრამ განა მარტო ასპინძის გამარჯვება დაისვა ასე იაფად პატარა კახმა?\nარა, იგი ყოველს მოგებულს ომში ჰკარგავდა მხოლოდ მცირეოდენს\nჯარსა, დიდს გამარჯვებას პატარა მსხვერპლით ახერხებდა, მრავალს\nმტერს მცირეოდენი ძალით ამარცხებდა, პატარა ღონისძიებით\nბრწყინვალე წადილს ეწეოდა და სწორედ ამაში მდგომარეობს უზენაესი\nღირსება სარდლისა. ეს ღირსება მეტადრე საჭირო იყო იმისთანა პატარა\nქვეყნისათვის, როგორიც იყო და არის საქართველო.\nოსმალოს ჯარის ამოჟლეტის შემდეგ ერეკლეს გზა სრულიად გახსნილი\nჰქონდა ახალციხისკენ და ამ ქალაქის აღება მას სრულიადაც არ\nგაუჭირდებოდა. მაგრამ ერთმა გარემოებამ ხელი სრულიად მოუცარა.\nსაქმე ის არის, რომ ქართლიდან ამბავი მოუვიდა: ტოტლებენი\nმოწადინებულია თბილისში ჩავიდეს თავისი ჯარით, გააუქმოს\nბაგრატიონთა მეფობა, შეუერთოს საქართველო რუსეთსა, დააფიცოს\nქართველობა რუსთა იმპერატორის ერთგულებაზე და თავისი თავი\nსაქართველოს მთავარ მმართველად გამოაცხადოსო. “გამართლდა,\nსავსებით გამართლდა ჩემი ეჭვი”, — სთქვა ერეკლემა და თავისი ჯარით\nდაუყონებლივ გამოეშურა თავისი სატახტო ქალაქისაკენ, პირდაპირი\n\nგზით ჯავახეთზე...\n10. შემაძრწუნებელი ჭორი\nსწორედ იმ დღეს, როდესაც ისე ბრწყინვალედ იმარჯვებდა ერეკლე\nმტრებზე, საქართველოს სატახტო ქალაქს თბილისში გავარდა საზარელი\nხმა: მეფე თავისი ჯარით მთლად დაღუპულა ახალციხის ახლოო.რამ\nდაბადა ეს ჭორი და საიდან გაჩნდა? როდესაც ქართლში დაბრუნდა\nტოტლებენი რუსის ჯარით და ერეკლე კი არსადა სჩანდა, ხალხში ეჭვი\nდაიბადა, — ვაითუ ერეკლეს უბედურება რამ შეემთხვაო. ეჭვი ჩქარა\nგარდაიქცა სამწუხარო ჭორად, რასაც ხელი შეუწყო იმან, რომ რუსები\nავრცელებდნენ ქართლში: ერეკლე, მარტოდ დატოვებული მტრის\nქვეყანაში, დაღუპვას ვერ ასცილდებაო. ამას ისიც დაერთო, რომ\nქართველს ჯარზე სრულიად არაფერი ამბავი არ ისმოდა. ამ ჭორმა,\nდაბადებულმა ზემო ქართლში, სწრაფად იარა, იზარდა, თბილისამდის\nმოაღწია და ყველას თავზარი დასცა.დედოფალს დარეჯანს, რომელიც\nმაშინ თბილისში ცხოვრობდა, ვერავინ უბედავდა ამ საზარელი ამბის\nმიტანასა. ბოლოს ერთი პატივცემული მანდილოსანი ბექთაბეგიანთ\nქვრივი, რომელიც დედოფალთან ძლიერ მიჩნეული იყო, აშფოთებული\nგაეშურა სასახლისაკენ, წარსდგა დედოფლის წინაშე და მდუღარე\nცრემლისღვრით მოახსენა დარეჯანსა: “დედოფალო, შენი ჭირიმე, ჩქარა\nავიყარენით აქედგან, ტყეში სადმე გავიხიზნოთ, მეფე თავის ჯარით\nდიდს საშინელებაში ჩავარდნილა”. ელდანაცემი დედოფალი მაშინვე\nწამოდგა ფეხზე, გაიძრო წუღები, ფეხშიშველა გამოვიდა გარეთ და\nსიონისაკენ გაეშურა, რათა მხურვალე ცრემლით შეევედრებინა\nუფლისათვის თავისი მეუღლე მეფე, იმისი ჯარი და მთელი\nსაქართველო. დედოფალს უკან დაედევნა მთელი სახლობა მეფისა:\nქალები ფეხშიშველები და კაცები ქუდმოხდილნი მიისწრაფოდნენ\nსიონისაკენა. ქალაქელებმა თავი ანებეს საქმეებს და ქალით-კაცამდე\nსიონს მიადგნენ შეძრწუნებულნი. ყველანი მხოლოდ ღვთისგან\nმოელოდნენ ნუგეშსა და შველასა და მდუღარე ცრემლით\nევედრებოდნენ. ეს შიში იმანაც უფრო განაძლიერა, რომ მტკვარს უცებ\n\nსისხლის ფერი მიეცა. ვაიმე, ეს ჩვენი ჯარის სისხლი უნდა იყოსო, —\nიფიქრა ყველამ და მწუხარებამ უფრო იმატა. ამ მწუხარებაში განვლო\nმთელმა ღამემ, ღამემ საშინელმა. მეორე დღეს ადიდებულის მტკვრის\nზვირთებმა ჩამოატარა მრავალი დამრჩვალი, და აღმოჩნდა, რომ ესენი\nყველანი ოსმალნი და ლეკები იყვნენ და მათში არც ერთი ქართველი არ\nერია. მაშინ კი როგორც დედოფალი, ისე მთელი თბილისი დარწმუნდა,\nრომ ერეკლესი და მისი ჯარის დაღუპვა ჭორი იყო, და გლოვა\nსიხარულად გარდაექცათ. მესამე დღეს ეს სიხარული უცებ საზარელ\nშიშზე შეიცვალა. თბილელებმა სოლოლაკის მთაზე დაინახეს ოსმალურ\nტანისამოსში გამოწყობილი მხედრობა. ვაი ჩვენ, მტერი შემოგვესიაო, —\nგაისმა თბილისის ქუჩებში, მაგრამ მალე შეშინებულს ქალაქს მოესმა ამ\nჯარისაგან მშვენიერი ქართული საომარი სიმღერა:\n“ვისაც მოუკლავს, ის მოჰკლავს ნადირსა შავი ტყისასა; ვინც დახვდა,\nიგივ დახვდება გულდაგულ რაზმსა მტრისასა”.დიდი შიში დიდ\nგაოცებად გადაიქცა. ხოლო ამ გრძნობამაც მალე დაუთმო ადგილი სხვა\nსულის მოძრაობას — უძლიერეს სიხარულსა, აღუწერელს აღტაცებასა.\nაღმოჩნდა, რომ ერეკლე დაწინაურებულიყო მცირეოდენი ცხენოსანი\nჯარითა, რომელსაც ჩაეცვა მდიდრული ოსმალური ტანისამოსი ასპინძის\nომში დახოცილი ფაშების, ბეგების და ჯარის სხვა უფროსებისა. მალე\nსოლოლაკის დაღმართზე ჩამოვიდა ძლევამოსილი ერეკლე, თავის\nმშვენიერს მერანზე მჯდომი. დედოფალი დარეჯანი გაეშურა თავისი\nგვირგვინოსანი მეუღლის მისაგებებლად. ახლაც მას ცრემლი პირისახეზე\nღაპაღუპით სდიოდა; მაგრამ ეს იყო ცრემლი გაუზომელი სიხარულისა,\nსრული ბედნიერის წამისა. მთელი ქალაქი მიეგება თავის სათაყვანებელს\nმეფეს გამოუთქმელი აღტაცებით. ასპინძის გმირი გადმოხტა ცხენიდან,\nჯერ მოეხვია თავის მეუღლეს და მერმე მიესალმა ხალხსა. მეფე-\nდედოფალი და ხალხი პირდაპირ სიონში გაეშურნენ, სადაც გადახდილი\nიქმნა სამადლობელი პარაკლისი კათალიკოსის ანტონის მიერ,\nრომელზედაც ყოველი ქართველი მხურვალე გულით ჰმადლობდა\nუფალსა ქართველი ჯარის ბრწყინვალე გამარჯვებისა და მტრის\n\nდამარცხებისათვის. იმავე დღეს ერეკლეს მშვენიერს სასახლეში,\nრომელშიაც ითვლებოდა თითქმის ორასი თვალი ოთახი, გაიმართა\nდიდი ნადიმი და მთელი ქალაქი მიეცა რამდენისამე დღის\nგანმავლობაში ლხინსა და შექცევასა.\n11. ტოტლებენის ბოლო. ერეკლესა და სოლომონ მეფეთა\nბრწყინვალე ლაშქრობა ოსმალეთში ტოტლებენმა მალე შეიტყო ერეკლეს\nბრწყინვალე გამარჯვება და საჩქაროთ დაბრუნება თბილისში, და დიდს\nსაგონებელში ჩავარდა: ვაითუ მეფემ ღალატისათვის სამაგიერო\nგადამიხადოს, თავისი ჯარით გზა შემიკრას რუსეთისაკენ, დამატყვევოს\nდა სასჯელს მიმცესო, შიშობდა იგი. ეს შიში მასში მით უფრო ძლიერი\nიყო, რომ არა ერთი და ორი რუსი ოფიცერი ხმამაღლა ჰკიცხავდა თავის\nუფროსის უღირსს საქციელსა. რათა ხიფათი აეცილებინა თავიდან,\nტოტლებენი აიყარა თავისი ჯარით სურამიდან და სწრაფად გასწია\nდუშეთისაკენ. იარა კავკასიის ქედის ძირამდინ და დაბინავდა ანანურში,\nსადაც მაშინ მაგარი ციხე იყო. ახლა მას რუსეთისაკენ გზას ვეღარავინ\nშეუკრავდა და ამიტომ ისევ სიბრიყვეზე შედგა. გარეშე სოფლების\nმცხოვრებლებს ძალას ატანდა — უარყავით თქვენი მეფე ერეკლე და\nდაიფიცეთ რუსეთის ხელმწიფის ერთგულებაზეო. ვინც უარს ამბობდა,\nარბევდა, სცემდა და სტანჯავდა. თანაც ტოტლებენი სწერდა რუსეთის\nმთავრობას პეტერბურგში, ცოტაოდენი ჯარი კიდევ მომაშველეთ, მეფე\nერეკლეს დავატყვევებ, რუსეთში გამოვგზავნი და საქართველოს რუსეთს\nშემოვუერთებო. მაგრამ უმაღლესი მთავრობისაგან უარი მოუვიდა:\nსაქართველო ძლიერ დაშორებულია რუსეთზე, გზებიც მეტად ძნელი\nსავალია, საქართველოსა და რუსეთს შუა ბევრი მთიული ხალხია\nდაუმორჩილებელი და ამიტომ ჯერჯერობით მაგ ქვეყნის შემოერთება\nუხერხულიაო. ერეკლე მეფემ ეს ამბავი სავსებით არ იცოდა,\nიმპერატრიცა ეკატერინესიც დიდი ხათრი ჰქონდა და ამიტომ\nტოტლებენს აპატია ყველა მისი სიბრიყვე და კარგი გული უჩვენა. რაკი\nტოტლებენი დარწმუნდა, რომ ერეკლე მას მტრულად არ მოექცეოდა და\nარას დაუშავებდა, თავისი ჯარით გასწია იმერეთისაკენ სოლომონ მეფის\n\nმისაშველებლად, როგორც ეს ნაბრძანები ჰქონდა ეკატერინესაგან.\nსოლომონ მეფე ებრძოდა ერთი მხრივ ოსმალებსა, რომელთაც ეჭირათ\nყველა სიმაგრე მისს სამფლობელოში, და მეორე მხრივ გურიის და\nსამეგრელოს მთავრებსა. მაგრამ ტოტლებენის მიშველებას არ მიშველება\nსჯობდა. თუმცა ციხეებში ოსმალებს ოცი-ორმოცი ჯარისკაცის მეტი არა\nჰყავდათ, მაგრამ ტოტლებენი ვერ ახერხებდა მათ აღებას და მთელი\nთვეობით იდგა მათ გარეშემო ყარყუმივით. როცა ციხე ბოლოს სიმშილის\nგამო დამორჩილდებოდა ხოლმე, ტოტლებენი უწყალოდ სცარცვამდა\nთვით ადგილობრივს მცხოვრებლებსაც. ამის გამო ყველამ შეიძულა იგი.\nგაძარცვის შიშით ციხეები აღარ ემორჩილებოდნენ და იბრძოდნენ\nუკანასკნელ სისხლის წვეთამდე. ტოტლებენის აღთქმას და ფიცს\nაღარავინ იჯერებდა. მაშინ მიმართა მან სოლომონ მეფის მეუღლეს,\nდედოფალს მარიამსა, და სთხოვა თავდებობა ეკისრა. ეს დედოფალი იყო\nყოვლად ღირსეული გვირგვინოსანი და მას ყველა იმერი უსაზღვროდ\nენდობოდა. ამიტომ საცა კი თავდებობა მან იკისრა, იქ ადვილად\nდამორჩილდნენ ტოტლებენს მეციხოვნენი. ეს აბეზარი გენერალი\nსოლომონ მეფესთანაც ვერ მოეწყო, რის გამოც რუსთა ჯარი ცალკე\nეომებოდა ოსმალებსა და იმერთა ჯარი კიდევ ცალკე. ერთხელ, როდესაც\nფოთის გარშემო იდგა ტოტლებენი თავისი ჯარით, ოსმალთა ჯარი\nშეუმჩნევლად მიუახლოვდა მას და სრულიად ამოჟლეტავდა რუსებსა,\nთუ სოლომონ მეფეს არ მიესწრო და უკუ არ ექცია მტერი. თვით\nსაკუთარს ჯარს ძლიერ ცუდად ექცეოდა, მეტისმეტი ანგარების გამო\nსაწყალ სალდათებს ჰხოცდა შიმშილით და უტანისამოსოდ. თითქმის\nმთელი ჯარი დაავადებული იყო და ჭერეხივით ეყარა. ბევრმა რუსის\nსალდათმა დალია სული აქ და მიებარა ცივს სამარეს უცხო, შორეულს\nქვეყანაში.\nბოლოს სიმართლემ მიაღწია პეტერბურგამდინ, და იმპერატრიცა\nეკატერინემ გამოსცვალა ტოტლებენი და მის ნაცვლად გამოგზავნა\nრუსეთიდან გენერალი სუხოტინი. მაგრამ ვერც ეს გამოდგა ღირსეული\nწინამძღოლი ჯარისა, და მალე იქმნა დაბარებული რუსეთში თავის\n\nჯარითურთ. ეს მოხდა 1772 წელს.\nდარჩა ამ სახით აღმოსავლეთისა და დასავლეთის საქართველო თავისთა\nძალთა ამარა ძლიერის მტრის წინააღმდეგ. ბევრი ჩვენებური ჩავარდა\nსაგონებელსა და შიშში. მაგრამ ეს შიში მალე გაიფანტა მთლად.\nქართველმა მეფეებმა — ერეკლემ და სოლომონმა — მოახერხეს\nშეკავშირება, შეუერთეს იმერთა და ამერთა ჯარები ერთმანეთსა და\nშეესივნენ ოსმალეთსა ახალციხის მხრივ. ციხეების აღებას თავი\nდაანებეს, ქვეყნების დაპყრობას შეუდგნენ და ბრწყინვალე გამარჯვებით\nიარეს თვით აზრუმამდინ. მაგრამ სწორედ ამ დროს ზავი და მშვიდობა\nჩამოვარდა რუსეთსა და ოსმალეთს შორის და ქართველი მეფენი\nიძულებულნი შეიქმნენ შეეიწყვიტათ ლაშქრობა და დაბრუნებულიყვნენ\nსამშობლოში, რაიცა მოხდა 1774 წელს.\nერეკლესა და სოლომონს დიდი იმედი ჰქონდათ, რომ სამშვიდობო\nტრაქტატის შეკვრის დროს რუსეთსა და ოსმალეთს შორის, მათ\nდაუბრუნდებოდათ ის კუთხეები საქართველოსი, რომელნიც ოსმალეთს\nეჭირა.საუბედუროდ, ეს იმედი მათ არ აუცხადდათ, ოსმალეთმა\nშეირჩინა წინათ დაპყრობილი ქართული ქვეყნები და ქართველ მეფეებს\nმხოლოდ მცირე რამ დაუთმო. სამაგიეროდ რუსეთმა ბევრი რამ მიიღო\nოსმალეთისაგან და თავის საზღვრები გააგანიერა სამხრეთის მხრივ.\nამ წერილს საფუძვლად დაედვნენ შემდეგნი თხზულებანი: „ქართლის\nცხოვრება“, Грамоты и другие Исторические документы XVIII столетия,\nდაბეჭდილი ამ უკანასკნელს ხანს პროფესორის ცაგარლის რედაქციით;\nნადირშაჰის ცხოვრების აღწერა, გენერალის ქიშმიშოვისა; Кавказская\nвойна, პოტოსი; Закавказье, დუბროვინისა, თხზულებანი ალექსანდრე\nორბელიანისა; Кавказские этюды, ვეიდენბაუმისა; აგრეთვე ზოგიერთი\nხალხური თქმულება, ახალციხის მხარეში დარჩენილი. ავტორი", "pages": "26–44"}, {"title": "ერეკლე მეფე და ინგილო ქალი", "text": "1\nერეკლე მეფეს ომი ჰქონდა ჭარის ლეკებთან და ძლიერ დაამარცხა ისინი.\nგამარჯვების შემდეგ თავისი ჯარით უკან გამობრუნდა. მეფე,\nორმოცდაათი წლის ვაჟკაცი, მშვენიერს ბედაურზე იჯდა და წინ\nმოუძღოდა ჯარს. ჯარი, გრძლად და ლამაზად დამწკრივებული,\nფეხდაფეხ მოსდევდა მეფეს. გზა საინგილოზე მოდიოდა. ერეკლე\nშემოვიდა ერთ განიერ ორღობეში, რომლის აქეთ-იქით ჩამწკრივებული\nიყო დიდრონი ვენახები და ბაღები, სავსე დამკრახული და დაბრაწული\nხილით.\nუცებ მეფეს ვიღაცამ თავზე გადმოაყარა ზემოდან მთელი ბღუჯა ქლიავი.\nგაოცებულმა მეფემ ბედაური შეაყენა. გაჩერდა ჯარიც. მიიხედ-მ
